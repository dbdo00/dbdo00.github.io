<h1 data-number="364" id="终结性作品">终结性作品</h1>
<p>处于同情恶人的怪异癖好，曾经每次想到京都动画
纵火事件总会同情纵火犯。对好事物 有一贯的怀疑、无理的愤怒。</p>
<p>最近开始看2010 年的 <em>K-ON ！！</em> 。
直观感觉是非常“强力”的作品，
几乎把自己喜欢的所有元素和“风格”都包含并且发挥，而且表现这些 到了极致。
这种事情的绝望之处是，以后你找不到其他喜欢的东西，或者
喜欢的都是过去的复制和模仿，至少对你是这样的印象。</p>
