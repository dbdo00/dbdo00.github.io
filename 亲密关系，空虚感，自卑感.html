<h1 data-number="177"
id="亲密关系空虚感自卑感">亲密关系，空虚感，自卑感</h1>
<h2 data-number="177.1" id="亲密关系">亲密关系</h2>
<p>我不相信我能建立任何的亲密关系，因为普通的人际关系已经让我持续不安了。</p>
<p>没有什么能让我放弃对他人厌恶自己的信念。</p>
<h2 data-number="177.2" id="空虚感">空虚感</h2>
<p>我无法自己满足自己，总是好像缺了什么。我不断地感到空虚，经常通过自我伤害造成来暂时麻痹自己。</p>
<h2 data-number="177.3" id="自卑感">自卑感</h2>
<p>我感到自己比别人缺了一些东西，这种差距无法通过任何行动来抚平。所以，我永远是无价值的，卑下的——这种情况无法被我改变。</p>
