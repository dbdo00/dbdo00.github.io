<p>我只能接受生活 什么都不能改变</p>
<p>文字的意义值得怀疑 脑子和嘴 越来越笨 不能表达</p>

<p>空洞的符号 躯体 找 失望 回不去</p>
<p>失去了人的元素 没有人能理解我 自言自语没用处</p>
<p>好像街上发疯的人 路人尊重地避而远之 甚至不如发疯的人
掩盖绝望，欲盖弥彰</p>
