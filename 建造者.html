<h1 data-number="107" id="建造者">建造者</h1>
<p><span><br />
<br />
2025-10-27
比起一个问题的解决者，我更愿意当一个建造者。但是什么是建造者？</span></p>
<p>从基本的零件组装起来，这是建造。如果只是从旁边解说或者观看，不能算是建造，
这似乎在我看来是比较无聊的事情。如果只是把现有的工具用的很熟练，这对
「建造」提供了很大遍历，可是无法把这当成最终的目的。因为练习操作本身，
不能提供和建造一样多的沉浸和满足。</p>
