<h1 data-number="416"
id="自我写作和公开写作的区别">自我写作和公开写作的区别</h1>
<p>公开写作是为了和人互动，得到别人的反馈。
私人写作更多是自我反思，和外界的关系不大。</p>
<p>解释一个东西是对外互动。陈列和谈论个人理解属于自我反思。
有时候界限并不明确。自我反思的主题如果尽力向外表达清楚，也会成为对外互动。</p>
<p>更多时候，公开写作的目的是出于虚荣。为了展示自己，给自己加上装饰物和光环，不管是表达还是描述都是一种表演。</p>
<p></p>
<p> <span><br />
<br />
2026-01-19
最大的问题是没有规则，而生活在偶然和外界环境中随波逐流。</span></p>
