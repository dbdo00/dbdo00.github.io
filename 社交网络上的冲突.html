<h1 data-number="405" id="社交网络上的冲突">社交网络上的冲突</h1>
<p>在社交网络上，不和人争论不代表就不会产生冲突。相反，如果太想实现与人亲密和睦容易引发不愉快的情况。</p>
<h2 data-number="405.1"
id="不知道为什么对方好像变得不喜欢自己了">不知道为什么，对方好像变得不喜欢自己了</h2>
<p>准社会关系让人之间并无充分的交流。如果没有沟通，就会永远不沟通。
每当我对着动态揣摩，聚关灯效应让这句话好像是对着自己说的一样。</p>
<h2 data-number="405.2"
id="和对方从来不能像自己想的一样亲密">和对方从来不能像自己想的一样亲密</h2>
<h2 data-number="405.3"
id="自己的话好像让对方讨厌了">自己的话好像让对方讨厌了</h2>
<p>自己在心里默默地祈求别人的回应，心情因为别人好的回应而高涨，因为回应的缺乏或者减少而揣测和难过。</p>
