<h1 data-number="368" id="我放松我的感官">我放松我的感官</h1>
<p>在萨特的书信里看到过“放松感官” 的词句。
走在街上的时候，我不刻意使用视力，也不特别留意声音。
但我不能也没有主动做些什么。 天黑以后暂时不再热得不能忍受， 还有点风。
路上人不太多，没有四五个人并排走把人行道堵住。
这样的状况，神经没有紧绷的理由。</p>
<p>晚上安静的世界，关了电脑，好像时间慢了几十倍。不会快乐到感觉不到
时间流逝，可是我也一点也不忧虑或者生气。
既不思考生活，也不思考世界。</p>
