<h1 data-number="193" id="模型">模型</h1>
<p>模型的意义的对未来的预测。现实世界是复杂的，但是我们需要预测它。
通过相对简单的规则， 我们希望大体推测未来会发生什么。</p>
<h2 data-number="193.1" id="不安">不安</h2>
<p>不安来自于不确定性。我们不知道未来会发生什么，危机出现的可能让我们不安。</p>
<p>也许你明天就会遇到事故。但也许你明天会得到想要的结果。
如果明确的知道结果，不管结果如何，都令人心安。</p>
<h2 data-number="193.2" id="预测">预测</h2>
<p>预测的目的不是绝对的准确；预测的目的是“明确”。我们想知道一个「答案」，
不管它是否是真相。</p>
