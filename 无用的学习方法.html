<h1 data-number="97" id="无用的学习方法">无用的学习方法</h1>
<p><span><br />
<br />
2025-11-15
旅游学习法或是社交学习法，从李小虎的频道看到的，现在发现</span>
终究是不实用。要考试就要安稳地做题，分析题目，其他的都是
干扰。更重要的是，如果只是在自己的城市呆着，也不会有旅游的
心情，只是会越来越厌倦。因为街上环境都很熟悉，走得久了
对自己只是单调；街景如果勾起之前不好的回忆，更加影响心情。
我也容易在外面感到紧张，无论如何都不能在店里轻松地摊开一本书来学习。</p>
