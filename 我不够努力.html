<h1 data-number="194" id="我不够努力">我不够努力</h1>
<p>我总是感觉自己太努力了，这意味着“过于用力”，
是错误的，功利的。我不愿意了解游戏的规则，对其不屑一顾。<br />
感觉私下里每个人都在做有用的事情，只是没有谈论他们。</p>
<p>而我以为「过分」程度的努力，其实是所需程度的底线。</p>
<p>每个人呈现的并不是真实的生活，只是感到舒适荣耀的部分？</p>
<p>发现生活中令我不适的点，他们看作是各种误解，真实的事情可能并不一样。<br />
既然真实的事情永远不会知道，我就选择让我舒适的那个解释。</p>
