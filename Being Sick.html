<h1 data-number="103" id="being-sick">Being Sick</h1>
<p>生病是令人恐惧的，消沉，痛苦。尼采却把疾病看作是正面的刺激启示和休息。
生病提醒人死亡，让人想到过去的生活是否值得。</p>
<p>痛苦的疾病会让人想睡觉，对挣扎的身体来说睡眠更加有价值。
身体虚弱的人会不断地得上各种越来越多的疾病。他的人生也因为健康的下降而越来越不幸福。</p>
