    const documents = [{"contents": "Precision and Sensitivity\nSensitivity is the rate in which we find the positive (e.g. a disease). False positive is not cared about.\nPrecision is the rate in which we find the true positive.\nBeyes Classifier\nLearning:  Learning is done by computing $P(y|{ x})$, where $x$ is the data.\nClassifying: $P(x^*|y)$ where $x$ is the new data.\nHow these probability computations are done? By MLE. TO be specific,...\nFor an event\n$p(y=c)= \\frac{\\sum^M_{i=1} \\mathbb I [y^{(i)} = c ]  }{M}  \\quad c \\in \\{1,2\\}$\n\u5e73\u5747\u6709\u591a\u5c11\u4e2a\u6837\u672c\u843d\u5728\u7c7b\u522b c \u4e2d\u3002\nMaximal Likelihood\nFunctions are convex =\u003e derivative = 0 means global manimum\nTODO. proof of gaussian distribution\u0027s ML estimation.\nA1Q2  \u7528\u6765\u4f30\u8ba1\u7684\u662f\u4e09\u4e2aiid\u968f\u673a\u53d8\u91cf\u3002\u5b9e\u9645\u4e0a\u662f\u4e00\u4e2a\u968f\u673a\u53d8\u91cf\u3002\nRegression\nHow is noise defined -- when we have done the regression knowing the $w$, is noise known?\n\u566a\u97f3\u7684\u53c2\u6570\u662f\u4f9d\u8d56\u4e8e\u8bef\u5dee$r$ \u7684\u3002\n\u540e\u9a8c\u5206\u5e03\n\u53c2\u6570$\\theta$ \u7684\u540e\u9a8c\u5206\u5e03\u7684\u5bc6\u5ea6\u662f $P(\\theta |D)$\u3002 \u8fd9\u4e2a\u662f\u53c2\u6570\u7684\u5206\u5e03\n\n$$P(\\theta |D ) = \\frac{P(D \\mid \\theta) P(\\theta)}{P(D)}$$\n\n$P(D)$ \u7684\u5b9a\u4e49\u662f\u6837\u672c\u5bc6\u5ea6\u3002\u7c7b\u4f3c\u4e8e Class Notes \u4e2d\u7684\u201c\u5e73\u5747\u6709\u591a\u5c11\u4e2a\u6837\u672c\u843d\u5728\u7c7b\u522b c \u4e2d\u201d\u3002\n\u540e\u9a8c\u9884\u6d4b $P(x^\\star \\mid \\theta )$\n\u8fd9\u53ea\u662f\u7ed9\u5b9a\u53c2\u6570$\\theta$ \u7684$x$.  \uff08\u610f\u601d\u662f $P(X = x^\\star \\mid \\theta)$ , $X$ \u6709\u4e00\u4e2a\u53c2\u6570\u662f$\\theta$. \u7684\u5206\u5e03\uff09\n\u540e\u9a8c\u4f30\u8ba1: $$p(x^\\star | D) = \\int P(x^\\star \\mid \\theta)P(\\theta |D)d\\theta$$\n\nprior \u7684\u521d\u59cb\u53c2\u6570\u600e\u4e48\u9009\u90fd\u53ef\u4ee5\u5417\uff1f\n\nMAP \u548c\u540e\u9a8c\u5206\u5e03\u533a\u522b\n\u540e\u9a8c\u5206\u5e03\u662f\u4e00\u4e2a\u5206\u5e03\u3002MAP \u662f\u6c42\u51fa\u4e00\u4e2a\u53c2\u6570\u7684\u6570\u5b57\u3002\nExample:  \u53ef\u4ee5\u7b97\u8fd9\u4e2a $y$ \u7684\u540e\u9a8c\u5206\u5e03\nSVM\nWhy should we penalize the weight \uff1f\n# step size for the sliding window\nstep = 4\n\n# extract window patches with step size of 4\npatches = skimage.util.view_as_windows(testimg, (19,19), step=step)\npsize = patches.shape\n\n# collapse the first 2 dimensions\npatches2 = patches.reshape((psize[0]*psize[1], psize[2], psize[3]))\nprint(patches2.shape )\n\n# histogram equalize patches (improves contrast)\npatches3 = empty(patches2.shape)\nfor i in range(patches2.shape[0]):\n    patches3[i,:,:] = skimage.exposure.equalize_hist(patches2[i,:,:])\n\n# extract features\nnewXf = extract_features(patches3)\n\n\nview_as_windows extract  \u56fe\u50cf\uff0c\u901a\u8fc7\u6ed1\u52a8\u7a97\u53e3\u3002\u5927\u5c0f19$\\times$ 19\npateches.shape   \u300c\u539f\u672c\u300d\u7684\u5f62\u72b6\npatches.reshape \u91cd\u65b0\u5851\u5f62\u3002 \uff08\u5e94\u8be5\u662f\u81ea\u52a8\u5224\u65ad\u524d\u4e24\u4e2a\u600e\u4e48collapse\uff1f\uff09\n\u6bcf\u4e2a patches2[i,:,:] \u662f\u4e00\u4e2a\u5c0fpatch.\npatches2 \u7b2c\u4e00\u4e2a\u7ef4\u5ea6\u662f\u4ec0\u4e48\uff1a\u662f\u6240\u6709patch \u7684\u6570\u91cf\npatches \u524d\u4e24\u4e2a\u7ef4\u5ea6\u662f\u4ec0\u4e48\uff1fnum_y_win (y\u65b9\u5411\u7a97\u53e3\u6570\u91cf) \u548c num_x_win (x\u65b9\u5411\u7a97\u53e3\u6570\u91cf)\u3002\nnum_y_win  \u7a97\u53e3\u4e0a\u4e0b\u6ed1\u52a8\u4e00\u5171\u80fd\u4ea7\u751f\u591a\u5c11\u884c\u7a97\u53e3\nnum_x_win \u7a97\u53e3\u5de6\u53f3\u6ed1\u52a8\u4e00\u5171\u80fd\u4ea7\u751f\u591a\u5c11\u884c\u7a97\u53e3\n\u540e\u9a8c\u5206\u5e03\nMaximum a posterior\n\u5982\u679c\u5728$\\theta=t$ \u65f6\uff0c\u6570\u636e$D$ \u6709\u5206\u5e03$p(D|\\theta =t)$. \u5e76\u4e14\u6211\u4eec\u4e5f\u5047\u8bbe\u77e5\u9053$\\theta$ \u662f\u4ec0\u4e48\u5206\u5e03\u3002\u90a3\u4e48MAP \u5c31\u662f\u8ba1\u7b97\n$$\\arg \\max_\\theta p(\\theta = t|D=x) = \\arg \\max_\\theta \\frac{p(D=x \\mid \\theta =t)p(\\theta =t)}{\\displaystyle\\sum_s p(D=x|\\theta=s)}$$\n[\u4fee\u6539] \u5b9e\u9645\u4e0a \u5206\u6bcd\u548c$\\theta$ \u6ca1\u5173\u7cfb\uff0c\u6240\u4ee5\u53ea\u8981\u6700\u5927\u5316\u5206\u5b50\u5c31\u53ef\u4ee5\n\n$$\\arg \\max_\\theta p(\\theta = t|D=x) = \\arg \\max_\\theta p(D=x \\mid \\theta =t)p(\\theta =t)$$\n\nML\u662f\u53cd\u8fc7\u6765P \u4e2d \u7684 $\\theta$ \u548c$D$\nPosterior Estimation\n\u7528\u5168\u90e8\u540e\u9a8c\u5206\u5e03\u7684\u5168\u90e8\u6982\u7387\u4ea7\u751f\u7684\u7ed3\u679c\u52a0\u6743\u5e73\u5747\uff08\uff1f\uff09\nBernoulli Update\n\u4e00\u5f00\u59cb\u7684\u5148\u9a8c\u662f\u5173\u4e8e\u53c2\u6570$\\pi$ \u7684beta\u5206\u5e03\u3002\n\u7ed3\u679c\u662f\u4e00\u4e2a\u4f2f\u52aa\u5229\u5206\u5e03\u4e2d\u53c2\u6570 $\\pi$ \u7684\u5206\u5e03\u3002\nK-means\n$\\pi_k$ \u89c2\u5bdf\u5230\u7b2ck\u5806\u7684\u6982\u7387\u3002\u8fd9\u662f\u4e00\u4e2a\u9690\u53d8\u91cf $Z= k$  \u7684\u6982\u7387\u3002\n\u89c2\u5bdf\u5230\u5411\u91cf$x_i$ \u7684\u6761\u4ef6\u4e0b\uff0c\u5728\u7b2c$k$ \u5806\u7684\u6982\u7387\uff1a\n$$\\gamma_{ik} = P(Z= k\\mid x_i )$$\n\u56e0\u4e3a\u4e00\u4e2a\u7a7a\u95f4\u6240\u6709\u6837\u672c\u6982\u7387\u603b\u548c\u4e3a$1$, \u6240\u4ee5$$\\sum_k \\gamma_{ik} = 1. \\tag{1}$$\nK means - Soft Assignment\n$Z = k \\mid x_i$  \u4e0d\u662f\u4e00\u4e2a\u5e38\u6570(\u5373\uff0c\u4e0d\u5728\u4efb\u610f\u4e00\u70b9\u6982\u7387\u662f1)\u3002\n$Z \\sim N(\\mu_k^{(0)}, \\sigma_k^{(0)})$ \u65f6\nE-M step \u53ef\u4ee5\u66f4\u65b0$\\mu_k$ \u548c$\\sigma_k$.  \u5206\u522b\u6709\u4e00\u4e2a\u516c\u5f0f\u2026\u2026\nHard Assignment\n$\\gamma_{ik} \\in \\{0,\\ 1\\}$  \u3002\u66f4\u65b0\u540e\u7684\u4e2d\u5fc3\u662f\u4e00\u5806\u4e2d\u6240\u6709\u70b9\u7684\u5e73\u5747\n$$\\mu_{k}^{(1)}=\\frac{\\sum \\gamma_{ik} x_i}{\\sum_i\\gamma_{ik}} =\\frac{\\sum_{i\u5728\u7b2ck\u5806\u4e2d} x_i}{\\sum_{i \u5728\u7b2ck\u5806\u4e2d} 1}$$\nMLE \u548c MAP \u533a\u522b\n1. \u6781\u5927\u4f3c\u7136\u4f30\u8ba1\uff08MLE\uff09\n\n\u4e0d\u9700\u8981\u5148\u9a8c\uff08No Prior\uff09\u3002\n\u57fa\u672c\u903b\u8f91\uff1a\u53ea\u5173\u6ce8\u5f53\u524d\u89c2\u5bdf\u5230\u7684\u6570\u636e $x$\u3002\u5b83\u5047\u8bbe\u53c2\u6570 $\\theta$ \u662f\u4e00\u4e2a\u56fa\u5b9a\u4f46\u672a\u77e5\u7684\u771f\u5b9e\u5e38\u6570\uff0c\u5bfb\u627e\u80fd\u4f7f\u6570\u636e $x$ \u51fa\u73b0\u6982\u7387\uff08\u4f3c\u7136 $p(x \\mid \\theta)$\uff09\u6700\u5927\u7684\u90a3\u4e2a $\\theta$\u3002\n\u6570\u5b66\u8868\u793a\uff1a\n$$\\hat{\\theta}_{\\text{MLE}} = \\arg\\max_{\\theta} p(x \\mid \\theta)$$\n\n2. \u540e\u9a8c\u4f30\u8ba1\uff08\u4f8b\u5982 \u6700\u5927\u540e\u9a8c\u4f30\u8ba1 MAP\uff09\n\n\u5fc5\u987b\u9700\u8981\u5148\u9a8c\uff08Requires Prior\uff09\u3002\n\u57fa\u672c\u903b\u8f91\uff1a\u57fa\u4e8e\u8d1d\u53f6\u65af\u5b66\u6d3e\u7684\u89c2\u70b9\uff0c\u53c2\u6570 $\\theta$ \u672c\u8eab\u4e5f\u662f\u4e00\u4e2a\u968f\u673a\u53d8\u91cf\uff0c\u5728\u89c2\u5bdf\u5230\u6570\u636e\u4e4b\u524d\u6211\u4eec\u5c31\u5bf9\u5b83\u6709\u4e00\u5b9a\u7684\u8ba4\u77e5\u6216\u503e\u5411\uff08\u5148\u9a8c\u5206\u5e03 $p(\\theta)$\uff09\u3002\u540e\u9a8c\u4f30\u8ba1\u901a\u8fc7\u8d1d\u53f6\u65af\u516c\u5f0f\u5c06\u201c\u5148\u9a8c\u201d\u4e0e\u201c\u6570\u636e\u4f3c\u7136\u201d\u7ed3\u5408\uff0c\u5bfb\u627e\u4f7f\u540e\u9a8c\u6982\u7387 $p(\\theta \\mid x)$ \u6700\u5927\u7684 $\\theta$\u3002\n\u6570\u5b66\u8868\u793a\uff1a\n$$\\hat{\\theta}_{\\text{MAP}} = \\arg\\max_{\\theta} p(\\theta \\mid x) = \\arg\\max_{\\theta} \\left[ \\underbrace{p(x \\mid \\theta)}_{\\text{\u4f3c\u7136}} \\cdot \\underbrace{p(\\theta)}_{\\text{\u5148\u9a8c}} \\right]$$\n\n\u603b\u7ed3\u5bf9\u6bd4\n\nMLE = \u7eaf\u7cb9\u770b\u6570\u636e\uff08$\\text{\u6570\u636e\u4f3c\u7136}$\uff09\n\u540e\u9a8c\u4f30\u8ba1\uff08MAP\uff09 = \u6570\u636e + \u7ecf\u9a8c\uff08$\\text{\u6570\u636e\u4f3c\u7136} \\times \\text{\u5148\u9a8c\u6982\u7387}$\uff09\n\u5f53\u5148\u9a8c\u5206\u5e03 $p(\\theta)$ \u662f\u5747\u5300\u5206\u5e03\uff08\u5373\u5bf9\u6240\u6709\u53ef\u80fd\u7684 $\\theta$ \u4e0d\u504f\u4e0d\u501a\uff0c\u7b49\u6982\u7387\u770b\u5f85\uff09\u65f6\uff0cMAP \u7684\u8ba1\u7b97\u7ed3\u679c\u5c31\u4f1a\u9000\u5316\u4e3a\u4e0e MLE \u5b8c\u5168\u4e00\u81f4\u3002\n\nFull Posterior distribution vs. MAP\nclass 1 with probability $p$\nclass  2 with probability $1-p$\nThe ratio is $\\frac{p}{1 - p}$.\nif both in the form exp, then $\\log p/(1-p) = \\log (exp (\\cdot)) = \\cdot$\n\u4e0d\u592a\u660e\u767d\uff1a\u6c42\u51fa\u6765likelihood \uff0c\u4f46\u662f\u4e0d\u77e5\u9053\u53c2\u6570\u662f\u4ec0\u4e48\u3002\u7528MLE \u6765\u8ba1\u7b97\u5417\uff1f\n", "id": 0, "link_path": "Machine_Learning_5489/Class_Notes.html", "title": "Class Notes", "title_path": "Machine_Learning_5489/class notes"}];
    index.addAll(documents);
    window.windex = index;

    function render(tag, attributes, ...children) {
      const elt = document.createElement(tag);
      Object.entries(attributes).forEach(([k, v]) => elt.setAttribute(k, v));
      children.forEach((child) =>
        typeof child === "string"
          ? elt.appendChild(document.createTextNode(child))
          : elt.appendChild(child)
      );
      return elt;
    }

    function search() {
      const resultsList = document.querySelector("#results");
      resultsList.innerHTML = "";
      const suggestions = document.querySelector("#suggestions");
      suggestions.innerHTML = "";

      const query = document.querySelector("#search").value;
      if (query === "") {
        return;
      }

      // populate the suggestion box
      const seen = new Set();
      for (let suggest of index.autoSuggest(query).splice(0, 15)) {
        if (query == suggest.terms[0]) {continue;}
        if (seen.has(suggest.terms[0])) {continue;}
        seen.add(suggest.terms[0]);
        suggestions.appendChild(render("option", {value: suggest.terms[0]}));
      }

      const result = index.search(query);
      for (let i of result.splice(0, 25)) {
        const {contents, link_path, title_path, terms} = i;
        const highlight = new RegExp(`(${terms.join("|")})`, "gi")
        resultsList.appendChild(
          render(
            "li",
            {class: "result"},
            render(
              "a",
              {class: "title_path", href: `../${link_path}`},
              ...title_path.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            ),
            render(
              "div",
              {class: "contents"},
              ...contents.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            )
          )
        );
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const searchBox = document.querySelector("#search");
      searchBox.focus();
      searchBox.addEventListener("input", search);
      search();
    });
