    const documents = [{"contents": "Independent Aftermath 1\n\ntoday I read the first question in the Chapter 8 \u0027independent aftermath\u0027  in the book \"Conversational problem Solving\". I wonder why is the probability \"symmetric\" for different $x_i$.\n\nI think the reason is that $p_i$ is the probability of Rebecca (in any ways) going to the one of the adjacent of $x_i$ then moving to the other adjacent of $x_i$,  the length of which adds up to the same number  n-1 all $x_i$, $2\\leq i \\leq n$\nRegarding the question above, I think the reason is that since Rebecca will eventually move to an adjacent of $x_i$, the probability of this event is 1. Therefore, conditioning on this event yields the same probability as $p_i$. (18:25)\n\nGraph\n\nIn the proof that an Euler walk exists if and only every vertex has an even degree (Theorem 1.8.1 in https://www.math.uni-hamburg.de/home/diestel/books/graph.theory/preview/Ch1.pdf), a subtle step is the following: if an edge is in $G-E(W)$, then there exists (possible another) edge $e$ incident to a vertex in in $W$.\nThen, the connected component $C$ of $e$ in $G\u0027$ is a smaller connected graph with even degrees. (It has to have fewer edges than $G$ does because $G\u0027$, where this component lies, is already much short of edges than $G$.) So, by induction hypothesis, $C$ has an Euler walk. Concatenation of it with $W$ finishes the proof.\n\n\n", "id": 0, "link_path": "journals/2025_11_20.html", "title": "2025_11_20", "title_path": "journals/2025_11_20"}, {"contents": "\nWhy is $\\gamma[ab]$ the identity when the fundamental group is abelian? [[Algebraic Topology]]\n\nI understood that this is because $\\gamma[ab]$ is a fundamental group element..\n\n\n\n", "id": 1, "link_path": "journals/2025_11_21.html", "title": "2025_11_21", "title_path": "journals/2025_11_21"}, {"contents": "\nSomething interesting to know: the map $x\\to x^p$ is a field homomorphism for any field of characteristic $p$, and so it is injective (field homomorphism = injective homomorphism).\n\nIt is surjective in finite field of characteristic $p$ because it is additionally a linear map. In fact, it is surjective on all perfect fields of characteristic $p$.\n\n\n\n\n", "id": 2, "link_path": "journals/2025_11_22.html", "title": "2025_11_22", "title_path": "journals/2025_11_22"}, {"contents": "\nSurprisingly, $x^p -a$ is either irreducible or has roots in the field even for field $K$ with ${\\rm char} K\\neq p$.\n\nI accidentally wrote a proof for this with condition ${\\rm char} K =p$, without realizing this has nothing to do with the characteristic of the field. [[Exercises in Field Theory]]\nhttps://math.stackexchange.com/questions/266171/irreducibility-of-a-polynomial-if-it-has-no-root-capelli/266239#266239\n\n\n\n\n\n", "id": 3, "link_path": "journals/2025_11_23.html", "title": "2025_11_23", "title_path": "journals/2025_11_23"}, {"contents": "\nThe Lagrange mean value theorem: Prove $f(\\xi) + f(\\zeta)=0$\n\n\n", "id": 4, "link_path": "journals/2025_11_25.html", "title": "2025_11_25", "title_path": "journals/2025_11_25"}, {"contents": "\n[Descend Argument](../Descend Argument)\nRecall that for all positive $\\epsilon$, $x^\\epsilon$ is $o(\\ln(x))$ as $x\\to 0$.\n\nthat is, $\\lim_{x\\to 0}x^\\epsilon\\ln (x)$.\nSo, $\\lim_{x\\to 0} \\frac{x\\ln(x)}{x^{1-\\epsilon}} =\\lim_{x\\to 0} x^\\epsilon \\ln (x) = 0$.\nMore roughly, we can say that $x\\ln(x) = O(x^{1-\\epsilon})$ for $|x| \u003c\\delta$.\nNotice that when $\\epsilon \u003e1$, everything above is still valid. (Why?)\nAnd it is not correct to say $\\color{red}x\\ln(x) =O(x) (\\quad \\rm incorrect)$\n\n\n\nToday I learned that Orbit Stablizer Theorem is about an orbit (of the conjugacy action of $G$ on a single element).\nThis helps to find the number of centralizer (the elements that commute with a group elment $x$). The  orbit of the action on $x$ is the conjugacy class and the stablizer is the centralizer. The conjugacy class of $x\\in S_n$ is easy to find. So the stablizer (e.g. centralizer) is easy to find.\n\n\n", "id": 5, "link_path": "journals/2025_11_26.html", "title": "2025_11_26", "title_path": "journals/2025_11_26"}, {"contents": "Orthogonal Projection\n\nI computed matrix of the adjoin operator $T^*$  under an orthonormal matrix, showing that it is the transpose matrix of $T$ under the same basis when they are over $\\mathbb R$ .\nThe adjoin operator of the restriction of an operator can be computed, too, via projection.\n\n\n\nTwo things I don\u0027t understand\n\nWhy is $V$ necessarily spanned by two eigenvectors, as the solution claims?\nlogseq.order-list-type:: number\n\nanswer: ((6932e5e1-39b7-450d-b428-3f1afad9e70e))\nlogseq.order-list-type:: number\n\n\nHow is the projection operator used? Did it simplify the calculation?\nlogseq.order-list-type:: number\n\nIt computed the projection of $A^t \\alpha$ unto $V$. No.\n\n\n\n\n\n\n\n\n2026-11-12: I just revisited this question. do not know what it says or the solution itself.\nThen i seem to realize what it means.\n$L_A \\alpha - A^t \\alpha$ is orthogonal to $\\beta_1,\\,\\beta_2$.\nSo, it is in the space $V^\\top$ spanned by the vector orthogonal to both $\\beta_1$ and $\\beta_2$ .\nA spanning vector of $V^\\top$ is $(1 \\quad -1\\quad 0)^\\top$.\nLet $v = (1 \\quad -1  \\quad 0)^\\top$ and $v_n = \\frac{1}{\\sqrt 2} (1 \\quad -1  \\quad 0)^\\top$ is its normalization.\n$$\\begin{align*}\n\u0026 (1 \\quad 3 \\quad -1)\\ v_n \\cdot v_n \\\\\n=\\ \u0026 \\frac{1}{2}\\ (1 \\quad 3 \\quad -1)\\ \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix} \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix} \\\\\n=\\ \u0026 \\frac{1}{2} \\times 2\\ \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix}  \\\\\n=\\ \u0026 \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix}\n\\end{align*}$$\nSo the answer is\n$$\\begin{pmatrix} 1 \\\\ 3 \\\\ -1 \\end{pmatrix} - \\begin{pmatrix} -1 \\\\ 1 \\\\ 0 \\end{pmatrix} = \\fbox {$\\begin{pmatrix} 2 \\\\ 2 \\\\ -1 \\end{pmatrix}$}.$$\n", "id": 6, "link_path": "journals/2025_12_01.html", "title": "2025_12_01", "title_path": "journals/2025_12_01"}, {"contents": "Invariant Space\nid:: 6932e5e1-39b7-450d-b428-3f1afad9e70e\n- Every invariant Space of $T\\in \\mathcal L(T)$  is a direct sum of spaces spanned by eigenvectors if  $T$ is diagonalizable. Suppose $V$ is an invariant space of $T$.\n- The idea is  to show $V=\\oplus (V\\cap V_\\lambda)$\n- Of course, $\\subset$ is obvious.\n- On the other hand, if $v = v_1 + \\ldots + v_n$, where $v_i$ are eigenvectors with different eigenvalues, then we need to show $v_i \\in V$ for each $i$. Use lagrange interpolation to construct  a polynomial. $f(\\lambda_k)=1$ if $k=i$ and $0$ otherwise. Thus $f(T)v_k = f(\\lambda_k)v_k$. This gives $f(A)v=v_i$. So $v_i \\in V$ by the invariance of $V$.\n- For a general $T\\colon: V\\to V$, an invariant space is a direct sum of spaces spanned by general eigenvectors. I do not know how this is done exactly.q\n\n\nLower Bound of Unipotent Matrix\n\nFor $A$ a matrix, if $A-I$ is nilpotent, then $A$ is said to be unipotent.\nDefine $\\|A\\| = \\max |a_{ij}|$. Then $\\|A\\|$ is lower bounded by $1$. Surprisingly, this can be proved using trace. In fact, there is at least one diagonal entry whose absolute value is not less than $1$.\nA thing I didn\u0027t grasp is that the trace is equal to the sum of eigenvalues counting the multiplicity. For the power, the trace is the sum of eigenvalues taken the power, counting the multiplicity.\n\n\n$$\\mathrm{trace} A^n= \\sum \\lambda_i^n$$\n\n\nThis is clear from the Jordan canonical form and I do not know how can one show this without JCF.\nThe upper bound of $\\|A^j\\|$ is $Kj^m$, where $K$ is a positive constant.\n\n\n\nGluing Lemma\n\nFor $X\\subset \\mathbb R^n$, if $X=A\\cap B$ and $A,B$ are closed sets, and $f\\mid A$, $f\\mid B$ are both continuous, then $f$ is continuous.\nI saw that this condition can be weakened to Hausdorff space, but I didn\u0027t look into it.\nThis lemma is useful for algebraic topology.\n\n\n\n\n", "id": 7, "link_path": "journals/2025_12_05.html", "title": "2025_12_05", "title_path": "journals/2025_12_05"}, {"contents": "The Little Learner\n\ntensor addition, multiplication: element-wise.\n$\\theta$ : the training history. You update it on each revision using the  law\n\nnew $\\theta_0$ = $\\theta_0$ - ($\\alpha \\times$ rate of change of loss wrt $\\theta_0$)\n\n\nrank of tensor: sum reduces the rank of tensor by 1.\ntensor^1, tensor^2.. are the notations to denote the rank of tensors.\npackages: Racket, malt\n\n\n", "id": 8, "link_path": "journals/2025_12_08.html", "title": "2025_12_08", "title_path": "journals/2025_12_08"}, {"contents": "Limit of Derivative of Different Orders\n\nWithout monotonicity, the limit of a function cannot be studied abstractly (i.e. using the certain existence theorems), because all existence theorems require monotonicity.\nDONE I will translate The Odyssey # 350.\u23f1 1s \u00b7 1 entry2025-12-12 Fri 11:13:33\u21922025-12-12 Fri 11:13:341s\nDONE Do the math question assigned by Gemini\u23f1 75h 14m \u00b7 1 entry2025-12-12 Fri 11:13:37\u21922025-12-15 Mon 14:28:1475h 14m 37s\nTODO Xiao p44-50 (goal). At least study it for 1h.\u23f1 1s \u00b7 1 entry2025-12-12 Fri 10:59:56\u21922025-12-12 Fri 10:59:571s\nDONE [[Dec 13th, 2025]] shower\u23f1 1s \u00b7 1 entry2025-12-15 Mon 14:28:26\u21922025-12-15 Mon 14:28:271s\n\n\n\n", "id": 9, "link_path": "journals/2025_12_12.html", "title": "2025_12_12", "title_path": "journals/2025_12_12"}, {"contents": "\ndeterminant: adding sides method to compute determinants.\ncalculus: intermediate value theorem. For the linear type of questions with constant coefficients, we can construct the function just like we do in for ODE.\nAbelian Fundamental Group: the isomorphism map of isomorphic fundamental groups, in this case, has only one  possibility --\n\nsuppose $x$ and $y$ are two base points, and $\\alpha$ and $\\alpha^\\prime$ are two paths connecting $x$ and $y$.\nIn this case, $[\\alpha(\\alpha^\\prime)^{-1}] \\in \\pi(y)$\n$\\alpha \\circ {\\alpha^\\prime}^{-1} = id_{\\pi(y)} \\implies \\alpha = \\alpha^\\prime$\n\n\n\n\n\n", "id": 10, "link_path": "journals/2025_12_15.html", "title": "2025_12_15", "title_path": "journals/2025_12_15"}, {"contents": "\nwhat am i even thinking about?\n\n\n", "id": 11, "link_path": "journals/2026_06_24.html", "title": "2026_06_24", "title_path": "journals/2026_06_24"}, {"contents": "\nIn the writeblog, how to test the behaviors? One  way is to let AI write test cases. That might be handy. For example, the passing of parameter might be missed, which causes errors.\nI didn\u0027t sleep last night after 2 am and fixed problems in the writeblog code. It was merely recreational.\n\n\n\n", "id": 12, "link_path": "journals/2026_06_25.html", "title": "2026_06_25", "title_path": "journals/2026_06_25"}, {"contents": "\nLet ( p ) be a prime number and ( n ) a natural number such that ( \\sqrt{n(n + p)} ) is an integer. Prove that ( n ) is a perfect square.\n#machine-learning sigmoid nn rarely dies: we can continuously change the weight. constant linear layer + $\\epsilon$ change in weight along $x^{(\\ell -1)}(x1) - x^{(\\ell - 1)}(x_2) \\neq 0$ = non-constant linear layer\n\n\n\n", "id": 13, "link_path": "journals/2026_06_27.html", "title": "2026_06_27", "title_path": "journals/2026_06_27"}, {"contents": "\nfour quadrant: urgency\ntrigger, behaviour, reward,\nTBR strategy\ntrigger strong\nearn the reward\ndefine the \u0027done\u0027\nYou can only do one thing at a tim\n\n", "id": 14, "link_path": "journals/2026_06_28.html", "title": "2026_06_28", "title_path": "journals/2026_06_28"}, {"contents": "\ndesign system \u0026 UI kit\natomic design\nprototype\n\ncomponent\n\nmaster, instances. the characteristics of instances inherit the master\nauto layout.\n\n", "id": 15, "link_path": "journals/2026_07_08.html", "title": "2026_07_08", "title_path": "journals/2026_07_08"}, {"contents": "\nwhy #LinUCB works\n\nthe exploration term comes from Cauchy inequality and covariance. Although it seems to ignore the ridge term (?)\nthe exploitation term comes from ridge regression\n\n\n\n\n\n", "id": 16, "link_path": "journals/2026_11_13.html", "title": "2026_11_13", "title_path": "journals/2026_11_13"}, {"contents": "\nQ: What is the largest number of points on the plain, each two of which have the equal $\\ell_1$ distance?\n\nIf $x \\in B(y)$, then $B(x) \\cap B(y) \\leq 2$. Where $B()$ is the $\\ell_1$ ball of the plane.\n\nIf $x,\\ y$  have \\ell 1 distance $d$, what is the number of other points having the equal distance from $x$ and $y$?\nThe answer is $2$, as the inequality above asserts.\n\n\nSo, the maximal number of pairwise $\\ell_1$-equidistant points on $\\mathbb R^2$ is $\\boxed 4$.\n\n\nDONE dual and support vectors t10 task 4\u23f1 7s \u00b7 10 entries \u00b7 1 open2026-11-15 Sun 20:06:21\u21922026-11-15 Sun 20:06:221s2026-11-15 Sun 20:06:23\u21922026-11-15 Sun 20:06:230s2026-11-15 Sun 20:06:24\u21922026-11-15 Sun 20:06:251s2026-11-15 Sun 20:06:26\u21922026-11-15 Sun 20:06:271s2026-11-15 Sun 20:06:28\u21922026-11-15 Sun 20:06:291s2026-11-15 Sun 20:06:29\u21922026-11-15 Sun 20:06:301s2026-11-15 Sun 20:06:31\u21922026-11-15 Sun 20:06:310s2026-11-15 Sun 20:06:32\u21922026-11-15 Sun 20:06:320s2026-11-15 Sun 20:06:33\u21922026-11-15 Sun 20:06:352s2026-11-15 Sun 20:06:37\u2192openrunning\ndual form. For SVM, $\\bm w=\\sum \\alpha_i y_i  \\bm x_i$\nhessian is negative semi-definite =\u003e function is concave\nHard margin SVM =\u003e support vector is on the boundary. We can use this to compute $b$.\nfull margin is $\\frac{2}{\\|w\\|_2}$. Primal objective is $\\frac{1}{2} \\|w\\|_2$.\n\n\nTODO https://distill.pub/2019/paths-perspective-on-value-learning/ \u60f3\u4e00\u4e0b\u600e\u4e48\u53ef\u89c6\u5316\u81ea\u5df1\u7684rl\u9879\u76ee\u23f1 1h 31m \u00b7 2 entries2026-11-15 Sun 23:34:53\u21922026-11-16 Mon 00:35:301h 37s2026-11-16 Mon 00:35:38\u21922026-11-16     index.addAll(documents);
    window.windex = index;

    function render(tag, attributes, ...children) {
      const elt = document.createElement(tag);
      Object.entries(attributes).forEach(([k, v]) => elt.setAttribute(k, v));
      children.forEach((child) =>
        typeof child === "string"
          ? elt.appendChild(document.createTextNode(child))
          : elt.appendChild(child)
      );
      return elt;
    }

    function search() {
      const resultsList = document.querySelector("#results");
      resultsList.innerHTML = "";
      const suggestions = document.querySelector("#suggestions");
      suggestions.innerHTML = "";

      const query = document.querySelector("#search").value;
      if (query === "") {
        return;
      }

      // populate the suggestion box
      const seen = new Set();
      for (let suggest of index.autoSuggest(query).splice(0, 15)) {
        if (query == suggest.terms[0]) {continue;}
        if (seen.has(suggest.terms[0])) {continue;}
        seen.add(suggest.terms[0]);
        suggestions.appendChild(render("option", {value: suggest.terms[0]}));
      }

      const result = index.search(query);
      for (let i of result.splice(0, 25)) {
        const {contents, link_path, title_path, terms} = i;
        const highlight = new RegExp(`(${terms.join("|")})`, "gi")
        resultsList.appendChild(
          render(
            "li",
            {class: "result"},
            render(
              "a",
              {class: "title_path", href: `../${link_path}`},
              ...title_path.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            ),
            render(
              "div",
              {class: "contents"},
              ...contents.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            )
          )
        );
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const searchBox = document.querySelector("#search");
      searchBox.focus();
      searchBox.addEventListener("input", search);
      search();
    });
