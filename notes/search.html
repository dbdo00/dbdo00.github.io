5 \u589e\u52a0\u4e00\u884c\u4e00\u5217\uff0c\u4fdd\u6301\u503c\u4e0d\u53d8\uff1a $$D_n = \\begin{vmatrix} 1 \u0026 1 \u0026 1 \u0026 \\cdots \u0026 1 \\\\ 0 \u0026 1+a_1 \u0026 1 \u0026 \\cdots \u0026 1 \\\\ 0 \u0026 1 \u0026 1+a_2 \u0026 \\cdots \u0026 1 \\\\ \\vdots \u0026 \\vdots \u0026 \\vdots \u0026 \\ddots \u0026 \\vdots \\\\ 0 \u0026 1 \u0026 1 \u0026 \\cdots \u0026 1+a_n \\end{vmatrix}$$ \u5c06\u7b2c\u4e00\u884c\u4e58\u4ee5 \u22121 \u52a0\u5230\u5176\u4f59\u5404\u884c\uff1a $$D_n = \\begin{vmatrix} 1 \u0026 1 \u0026 1 \u0026 \\cdots \u0026 1 \\\\ -1 \u0026 a_1 \u0026 0 \u0026 \\cdots \u0026 0 \\\\ -1 \u0026 0 \u0026 a_2 \u0026 \\cdots \u0026 0 \\\\ \\vdots \u0026 \\vdots \u0026 \\vdots \u0026 \\ddots \u0026 \\vdots \\\\ -1 \u0026 0 \u0026 0 \u0026 \\cdots \u0026 a_n \\end{vmatrix}$$ \u6309\u7b2c\u4e00\u5217\u5c55\u5f00\u6216\u5316\u7b80\uff0c\u6700\u7ec8\u7ed3\u679c\u4e3a\uff1a\n\u8bbe\u51fd\u6570 f(x) \u5728 [0,1] \u4e0a\u8fde\u7eed\uff0c\u5728 (0,1) \u5185\u53ef\u5bfc\uff0c\u4e14 f(0)=f(1)=0\uff0cf(x)\ue020\u22610\u3002 \u8bc1\u660e\uff1a\u5b58\u5728 \u03be\u2208(0,1)\uff0c\u4f7f\u5f97\nf\u2032(\u03be)+2025f(\u03be)=0\n", "id": 56, "link_path": "Untitled_2.html", "title": "Untitled 2", "title_path": "untitled 2"}, {"contents": "The slice angles form a geometric sequence $a_n$, with common ratio $r = 1.22$, and the initial term $a_0=10$.\nLet the number of slices be $n$. Then\n\n$$10(\\frac{r^n - 1}{r - 1}) =  10 ( 1 + r + \\ldots + r^{n-1} ) =\\  \\rm total\\ angle$$\n\nHere the total angle is of that of the circular cake, which is  360 degree.\nRearrangement gives $n = \\frac{\\ln [ (r - 1 ) ({\\rm \\ total\\ angle }/10) + 1 ]}{\\ln r} = 11.0047... \\approx 11$\nIn the slices, the taken ones are the 4th and 8th.\nThe angle of the 4th: $a_3 = 10 \\cdot r ^3$.\nTHe anlge of the 8th: $a_7 = 10 \\cdot r^4$.\nThe total angles taken:\n$${\\rm taken\\ } = 10 \\times (r^3 + r^7) \\approx 147.50209$$\nSo the remaining area is:\n$$\\pi r^2  \\times \\left ( 1 - {\\rm taken\\ } / 360\\right) \\approx 65$$.\n", "id": 57, "link_path": "Untitled_3.html", "title": "Untitled 3", "title_path": "untitled 3"}, {"contents": "\n\u5e73\u79fb\u4e0d\u53d8\u6027  \u3002\u5b58\u5728d, \u5bf9\u4efb\u610f\u4e24\u70b9\u3002 d(T(p), T(p\u0027) )= d(p,p\u0027)\n\u65cb\u8f6c\u4e0d\u53d8\u6027 \u5b58\u5728 R, \u5bf9\u4efb\u610f\u4e24\u70b9        d(R(p), R(p\u0027))= d(p,p\u0027)\nd \u662f\u4e00\u4e2a\u5ea6\u91cf\u3002\n\u8bc1\u660e\u8fd9\u4e2ad \u6ee1\u8db3\u52fe\u80a1\u5b9a\u7406\n\n", "id": 58, "link_path": "Untitled_4.html", "title": "Untitled 4", "title_path": "untitled 4"}, {"contents": "FNR \u53ec\u56de\u7387\uff1a\u6b63\u786e\u627e\u5230\u7684/\u6240\u6709\u7684\u76ee\u6807\nFPR \u51c6\u786e\u7387\uff1a\u6b63\u786e\u627e\u5230\u7684/\u6240\u6709\u627e\u5230\u7684\nFN \u62d6\u7d2f\u53ec\u56de\u7387\nFP \u62d6\u7d2f\u7cbe\u786e\u7387\n", "id": 59, "link_path": "\u4e0d\u540c\u7684\u6307\u6807\u610f\u601d.html", "title": "\u4e0d\u540c\u7684\u6307\u6807\u610f\u601d", "title_path": "\u4e0d\u540c\u7684\u6307\u6807\u610f\u601d"}, {"contents": "\u6982\u7387\u5c31\u662f\u7528\u5404\u79cd\u65b9\u5f0f\u8ba1\u7b97\u52a0\u6743\u548c\n\n$$E[g(X)]$$\n\n\u4fe1\u606f\u8bba\uff1a\u52a0\u6743\u548c\u7528\u5bf9\u6570\u5355\u4f4d\n", "id": 60, "link_path": "\u6982\u7387\u5c31\u662f\u7528\u5404\u79cd\u65b9\u5f0f\u8ba1\u7b97\u52a0\u6743\u548c.html", "title": "\u6982\u7387\u5c31\u662f\u7528\u5404\u79cd\u65b9\u5f0f\u8ba1\u7b97\u52a0\u6743\u548c", "title_path": "\u6982\u7387\u5c31\u662f\u7528\u5404\u79cd\u65b9\u5f0f\u8ba1\u7b97\u52a0\u6743\u548c"}];
    index.addAll(documents);
    window.windex = index;

    function render(tag, attributes, ...children) {
      const elt = document.createElement(tag);
      Object.entries(attributes).forEach(([k, v]) => elt.setAttribute(k, v));
      children.forEach((child) =>
        typeof child === "string"
          ? elt.appendChild(document.createTextNode(child))
          : elt.appendChild(child)
      );
      return elt;
    }

    function search() {
      const resultsList = document.querySelector("#results");
      resultsList.innerHTML = "";
      const suggestions = document.querySelector("#suggestions");
      suggestions.innerHTML = "";

      const query = document.querySelector("#search").value;
      if (query === "") {
        return;
      }

      // populate the suggestion box
      const seen = new Set();
      for (let suggest of index.autoSuggest(query).splice(0, 15)) {
        if (query == suggest.terms[0]) {continue;}
        if (seen.has(suggest.terms[0])) {continue;}
        seen.add(suggest.terms[0]);
        suggestions.appendChild(render("option", {value: suggest.terms[0]}));
      }

      const result = index.search(query);
      for (let i of result.splice(0, 25)) {
        const {contents, link_path, title_path, terms} = i;
        const highlight = new RegExp(`(${terms.join("|")})`, "gi")
        resultsList.appendChild(
          render(
            "li",
            {class: "result"},
            render(
              "a",
              {class: "title_path", href: `../${link_path}`},
              ...title_path.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            ),
            render(
              "div",
              {class: "contents"},
              ...contents.split(highlight).filter(m => m).map(m => m.match(highlight) ?
                render("span", {class: "highlight"}, m) : m)
            )
          )
        );
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const searchBox = document.querySelector("#search");
      searchBox.focus();
      searchBox.addEventListener("input", search);
      search();
    });
  </script>
