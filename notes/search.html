    const documents = [{"contents": "20250806230134\n$[\\ln n]^2$  has a smaller order than $n$\n$1 + \u00bd + \\ldots 1/n \\leq \\ln n + 1$\nhttps://www.bilibili.com/video/BV18xJHzCEAq\nhttps://xuda-ye.com/wp-content/uploads/2025/05/non_stoltz_limit.pdf\n", "id": 0, "link_path": "20250805094022.html", "title": "20250805094022", "title_path": "20250805094022"}, {"contents": "Definition Of e\nThe sequence $(1 + 1/n)^n$ is an increasing sequence.\n", "id": 1, "link_path": "20250826205450.html", "title": "20250826205450", "title_path": "20250826205450"}, {"contents": "Supremum\n", "id": 2, "link_path": "20250828104023.html", "title": "20250828104023", "title_path": "20250828104023"}, {"contents": "cat db.json | jq \u0027.[9].content\u0027 -r | pandoc -t json | jq \u0027.blocks.[0] | if .t == \"Header\" then .c.[2].[0].c end\u0027 -r\n\n\n", "id": 3, "link_path": "20250830003927.html", "title": "20250830003927", "title_path": "20250830003927"}, {"contents": "Partial Summation\nQuestions\nFind the asymptotic expression for the  following functions: $\\sum_{n\u003c x}n \\log(n)$, $\\sum_{n\u003c x} \\log(n)$, $\\sum_{n\u003c x} \\frac{1}{n}$.\nSometimes we want to find the growth trend of the summations that have no closed form formulae.\nInstead of the summation, we integrate it and see how much error we get. The integration may give a simpler expression that is easier to take limits.\nPartial Summation\nLet $\\{a_n\\}$ be a sequence of complex numbers and $f(t)$ a differential function for $t\\geq 0$. Set $A(x) = \\sum_{n\\leq x}a_n$. Then\n$$\\sum_{n\\leq x}a_n f(x) = A(x)f(x) - \\int^x_1 A(t)f^\\prime(x)dt$$\nProof Note $a_n = A(n) -A(n-1)$.\n\n$$\\begin{align*} \n\u0026 \\sum_{n \u003c x} (A(n) \u0026- \u0026A(n-1)) f(n) \u0026\\\\ \n= \u0026 \\sum_{n \\leq x} A(n)f(n) \u0026- \u0026\\sum_{n\\leq x} A(n-1) f(n)\u0026 \\\\ \n= \u0026 A(x)f(x) \u0026+ \u0026\\sum_{n \\leq x - 1} A(n)f(x + 1) \u0026\\\\ \n=\u0026 A(x)f(x) \u0026- \u0026\\int^x_1A(t)f^\\prime(t)dt \u0026\\end{align*}$$\n\nExamples\n$\\sum_{p \\text{ prime}  grows like $\\log\\log(x)$\n", "id": 4, "link_path": "Abel_Partial_Summation.html", "title": "Abel Partial Summation", "title_path": "abel partial summation"}, {"contents": "Probability\nTheorem 1 (Markov\u0027s inequality)\n$P(X\\geq \\lambda) \\leq \\frac{E(X)}{\\lambda}$\nProof.\n$\\int^\\infty_0 xf_X(x)dx \\geq \\int^\\infty_\\lambda \\lambda f_X(x)dx$\nsince $x f_X(x) \u003e \\lambda f_X(x)$ for  $x \u003e\\lambda$.\nThe proof for the discrete case is similar and so omitted.\nLemma 1.2 (Borel-Cantelli lemma) Let $E_1, E_2 \\ldots$ be a sequence of events (possibly infinite or dependent),  such that $\\sum_n P(E_n) \u003c \\infty$. Then for any integer $M$, we have\n$$P(\\text{fewer than $M$ of the events} E_1, E_2, \\ldots, \\text{ hold}) \\geq 1 - \\frac{\\sum_n P(E_n)}{M}$$\nProof. The value of $\\sum_n I(E_n)$ is the number events in $E_1, E_2, \\ldots$ that hold.  $E(\\sum_n I(E)) = \\sum_n P(E_n)$.  The result follows from markov inequality with $\\lambda = M$.\nSum-Free\nThe random variable $k$  and the value $a$ is assumed to be independent. It does not matter what the probability distribution is  \u2014 any distribution works.\n", "id": 5, "link_path": "Additive_combinatorics.html", "title": "Additive combinatorics", "title_path": "additive combinatorics"}, {"contents": "#. $$\\int_{x^2 +y^2 \\leq 1} |3x + 4y|dxdy$$\nSolution.\nLet $\\varphi=\\arctan(3/4)$. Then $$\\sin(\\theta + \\varphi)=\\sin(\\theta)\\cos(\\varphi) + \\cos(\\theta)\\sin(\\varphi)=\\frac{1}{5}\\bigg( 4 \\sin(\\theta) + 3 \\cos(\\theta)\\bigg).$$\n\n\nUse the polar coordinate $x=r\\cos(\\theta), y=r\\sin(\\theta)$.  Let $u=\\theta + \\varphi$.\n\n\n\n$$\\begin{align*}\n   \u0026 \\int^1_0 \\int^{2\\pi}_0 |3 r cos(\\theta) + 4 r \\sin(\\theta)| {\\color{blue} r}d\\theta dr \\\\\n   = \u0026\\int^1_0 \\int^{2\\pi}_0 5r^2 |\\sin(\\theta + \\varphi)|d\\theta dr\\\\\n  = \u0026\\frac{5}{3}\\int^{2\\pi}_0{\\color{red}|\\sin(u)|}du \\\\ \n  = \u0026 \\frac{20}{3}\n  \\end{align*}$$\n\nComments:\n\n$\\int^{a+T}_{a} f(t)dt = \\int^T_0 f(t)dt$ for a periodic function having period $T$ because $\\int^{a}_0 f= \\int^{a+T}_Tf$ .\nLet $u=\\theta + \\varphi$. Then $$\\int^{2\\pi}_0 |f(\\theta + \\varphi)|d\\theta = \\int^{2\\pi + \\varphi}_\\varphi |f(u)|du=\\int^{2\\pi }_0 |f(u)|du$$ by the last comment.\n\n\n\nConsider to simplify the integrated function to avoid complicated integral regions.\nIntegrals involving Absolute Values\np-series\n#. $$\\lim_{n\\to \\infty} n^2 \\int^{1/n}_0 x^{x+1}dx$$\nSolution. By l\u0027hospital\u0027s rule, $$\\lim_{x\\to 0+} x^{\\epsilon}\\ln x =0$$ for all $\\epsilon \u003e0$. So $\\ln x = o(x^{-\\epsilon})$ when $x\\to 0+$. Taylor expansion gives\n$$x^x = \\exp(x\\ln x) = 1 + x\\ln x + O(x\\ln x) = 1 + o(x^{1-\\epsilon}) + o(x^{1-\\epsilon}) =1 + o(x^{1-\\epsilon})$$ Note $\\int^{1/n}_0 o(x^{2-\\epsilon})dx \\leq o(1)\\int^{1/n}_0 x^{2-\\epsilon}dx =o(1)\\frac{1}{3 - \\epsilon}1/n^{3-\\epsilon}$.  Choose $0\u003c \\epsilon \u003c 2$. Then $$\\int^{\\frac{1}{n}}_0 x^{x+1} dx =\\int^{\\frac{1}{n}}_0 x + o(1/n^{2-\\epsilon}) dx  = \\frac{1}{n^2} + o(\\frac{1}{n^{3-\\epsilon}})$$\nSo $$\\lim_{n\\to \\infty} n \\int^{1/n}_0 x^{x+1}dx =  \\lim_{n\\to \\infty} 1 + o(\\frac{1}{n^{1-\\epsilon}}) = 1$$.\nComment: The $+1$ here in the exponent has the effect of making the function goes faster to 0 at $0$.\n\n\nIf it is $+2$, then you would get smaller values (something like $\\frac{C}{n^3} + \\ldots$).\n\n\nThe $n^2$ in the question can be change $n^{2-\\epsilon}$ for all $\\epsilon \u003e0$.\n\n\n", "id": 6, "link_path": "Analysis.html", "title": "Analysis", "title_path": "analysis"}, {"contents": "The interval $[a,b)$ is not compact in the usual topology of $\\mathbb R$\n", "id": 7, "link_path": "Compactness_and_Uniform_Continuity.html", "title": "Compactness and Uniform Continuity", "title_path": "compactness and uniform continuity"}, {"contents": "TCP\n\u9762\u5411\u5b57\u8282\u6d41\u3002\n", "id": 8, "link_path": "compnet.html", "title": "compnet", "title_path": "compnet"}, {"contents": "Due on November 20, 2026, 11:59pm\nExercise 1\n[2 points]. Prove that the eigenvalues of a real symmetric matrix $A \\in R^{N \u00d7N}$ ,\nwhere $A = A^\\top$ , are real-valued (i.e., not complex-valued). Prove also that\nthe eigenvectors of A corresponding to different eigenvalues are orthogonal\nto each other\nProof.\nFor $v,\\ w \\in \\mathbb C^N$, let $\\langle v, w \\rangle$ denote $v^\\top \\bar w$  , where $\\bar w$ is the complex conjugate of the vector $w$.\nLet $t \\in \\mathbb C$. Then $$\\begin{equation}\n\\bar t \\langle v,\\ w\\rangle = \\bar t v^\\top \\bar w = v^\\top \\bar t \\bar w = v^\\top \\overline{t w} = \\langle v,\\ tw\\rangle \\end{equation}.$$\n$$\\begin{equation} t\\langle v,\\ w \\rangle = tv^\\top \\bar w= (tv)^\\top \\overline w = \\langle tv,\\ w \\rangle  \\end{equation}$$\n$$\\begin{equation} \\langle v,\\ v \\rangle = v^\\top \\bar v= v_1 \\overline v_1 + \\ldots + v_N \\overline v_N \\geq 0\\end{equation}$$\nwhere $v = (v_1, \\ \\ldots ,\\ v_N)^\\top$.\nLet $A^*$ denote the complex transpose of a matrix $A$.  Then $$\\langle v, Av \\rangle = v^\\top \\overline{Av}=v^\\top \\overline{A^\\top}^\\top v=v^\\top (A^*)^\\top v = (A^* v)^\\top v = \\langle A^* v ,\\ v \\rangle$$   Suppose $v$ is an eigenvector of $A$ associated with the eigenvalue $\\lambda$.\nIf $\\langle v,\\ v\\rangle = 0$, then $v_1 \\overline v_1 + \\ldots + v_N \\overline v_N =0$. Since $v_i \\overline v_i \\geq 0$ and $=0$ only when $v_i=0$,  we know $$v_i=0 \\quad {\\rm for \\ each\\ } i \\in \\{1,\\ldots,N\\}.$$Hence $v=0$.  In this case, the eigenvalue of $v$ is $0$, which is real valued.\nIf $\\langle v,\\ v\\rangle \u003e0$, then\n$$\\overline\\lambda = \\frac{1}{\\langle v,\\ v\\rangle}\\overline \\lambda \\langle v,\\ v\\rangle$$\nBy Eq   $\\boxed{\\overline t\\langle v,\\ w \\rangle=\\langle  v,\\ tw \\rangle}$, we get\n$$\\overline \\lambda =\\frac{1}{\\langle v,\\ v\\rangle} \\langle v,\\ \\lambda v\\rangle =\\frac{1}{\\langle v,\\ v\\rangle} \\langle v,\\ Av \\rangle$$ By $\\boxed {\\langle v, Av \\rangle =  \\langle A^* v ,\\ v \\rangle}$, we get\n$$\\overline \\lambda  = \\frac{1}{\\langle v,\\ v\\rangle} \\langle A^* v ,\\ v \\rangle=\\frac{1}{\\langle v,\\ v\\rangle} \\langle \\lambda v,\\ v\\rangle = \\frac{1}{\\langle v,\\ v\\rangle} \\lambda  \\langle v,\\ v\\rangle = \\lambda$$\nSo we have derived that $\\boxed{\\overline \\lambda = \\lambda}$.  So any eigenvalue of $A$ is real-valued.\nSuppose $v,\\ w$ are eigenvectors of $A$ associated with $\\lambda_v$ and $\\lambda_w$. Then $$\\langle Av,\\ w \\rangle = \\lambda_v \\langle v,\\ w \\rangle$$ and since $A\\in \\mathbb R^{N\\times N}$,  $$\\langle Av,\\ w \\rangle =  \\langle v,\\ A^*w \\rangle = \\langle v,\\ A^\\top w \\rangle=\\langle v,\\ Aw \\rangle = \\lambda_w \\langle v,\\ w \\rangle.$$\nSo $$0 =\\langle Av,\\ w \\rangle - \\langle Av,\\ w \\rangle = (\\lambda_v - \\lambda_w) \\langle v,\\ w \\rangle$$ which implies $\\langle v,\\ w \\rangle = 0$ because $\\lambda_v - \\lambda_w \\neq 0$.\nExercises 2\n[5 points]. Derive the K-th largest direction of variance in principal component analysis (PCA).\nSolution.\n", "id": 9, "link_path": "CS5489_Home_Assignment_4.html", "title": "CS5489 Home Assignment 4", "title_path": "cs5489 home assignment 4"}, {"contents": "This notes discusses the proof of Fermat\u0027s theorem about sum of squares, which is described as a \"descend argument\".\nFermat propose the following proposition\n\nA prime number $p$ is a sum of two squares $a^2 + b^2$, where $a$ and $b$\nare coprime, if and only if $p \\equiv 1 \\pmod 4$.\n\n\n\nAn integer $a$ is congruent to another integer $a^\\prime$ such that $|a^\\prime|.\n\n\nLet $N=a^2 +b^2$, $\\gcd(a,b)=1$. If all primes divisors of $N$ are sum of squares, then $p\u003e0$, the greatest primes divisor of $N$, is a sum of squares.\n\n\nThe contrapositive is that: if $p$ is not a sum of squares, then there exists\nsome $q$, $q\\mid N$ and $q, such that $q$ is not a sum of squares.\nThen $q | N$ and is not a sum of squares. We can find a prime divisor smaller than $q$ that is not a sum of squares... So we get a decreasing sequence of prime numbers. A contradiction is found.\n", "id": 10, "link_path": "Descend_Argument.html", "title": "Descend Argument", "title_path": "descend argument"}, {"contents": "DP \u9700\u8981\u628a\u5927\u7684\u95ee\u9898\u5f52\u7ed3\u5230\u5c0f\u7684\u95ee\u9898\u3002\u4f46\u662f\u300c\u5927\u5c0f\u300d\u7684\u5b9a\u4e49\u53d6\u51b3\u4e8e\u5177\u4f53\u7684\u95ee\u9898\u3002\n\u5728\u80cc\u5305\u95ee\u9898\u4e2d\uff0c\u6bd4\u8f83\u660e\u663e\u2014\u2014\u5927\u5c0f\u662f\u5305\u7684\u603b\u91cd\u91cf\u3002\n\u5728SPP\u4e2d\uff0c\u662f\u300c\u6700\u591a\u300d\u5141\u8bb8\u7684\u6b65\u6570$k$. \u5f53$k$ \u5c0f\u7684\u65f6\u5019\uff0c\u5f88\u591a\u8def\u5f84\u4e0d\u5b58\u5728\uff0c\u6700\u5c0f\u8ddd\u79bb\u7b80\u5355\u5730\u53d8\u6210$\\infty$ . \u63a5\u4e0b\u6765\uff0c\u6211\u4eec\u53ef\u4ee5\u5bf9\u4e0b\u4e00\u4e2a\u66f4\u5927\u7684$k+1$ \u6b65\u5185\u7684\u89e3\u8fdb\u884c\u5bfb\u627e\u3002\n", "id": 11, "link_path": "dynamic_programming.html", "title": "dynamic programming", "title_path": "dynamic programming"}, {"contents": "Field Extension\nSplitting Field\nTheory\nLet $\\sigma \\colon E \\to F^\\prime$ be an isomorphism of fields, let $f(x) \\in F[x]$, and\nExercises\n\nSeparability\n\nIf $F$ is a perfect field with characteristic $p\u003e0$, then every element\nhas a $p$-th root.\n\nProof. Let $a$ be an arbitary element in $F$.\nLet $\\alpha$ be a root of the polynomial $x^p -a$.\nSince the field has characteristic $p$,\n$x^p - a = x^p - \\alpha^p = (x-\\alpha)^p$.\nSo the polynomial has repeated roots, hence not irreducible in $F$,\nbecause $F$ is a perfect field in which every irreducible polynomial\nis separable, i.e. has no repeated roots. So, the minimal polynomial\n$f(x)$ of $\\alpha$ over $F$ has degree $d\u003c p$.\nSince $f(x)\\mid (x-\\alpha)^p$, we conclude that $f(x)=(x-\\alpha)^d =x^d + \\ldots  + (-\\alpha)^d$ is the minimal polynomial of $\\alpha$, and so $\\alpha^d \\in F$.\nSuppose $ap + bd =1$. Then $\\alpha = \\alpha^{ap+bd} =(\\alpha^p)^a (\\alpha^d)^b \\in F$. So, the $p$-th root of $a$ is in $F$. $\\square$\n\nRemark: I believe that the above argument also proves the following: Over a field $K$ (of any char), $x^p -a$ is either irreducible or has completely reducible (i.e. has the root in K).\n\nThe converse proposition is also true:\n\nIn a field $F$ with characteristic $p\u003e0$, if every element has a $p$-th root, then $F$ is a perfect field.\n\nProof.  Let $f(x)\\in F[x]$ be irreducible.\nSuppose $f(x)$ has repeated roots, then $f^\\prime(x)=0$.\nBut this means that $f(x)=[g(x)]^p$ for some $g(x)\\in F[x]$. Suppose\n$$g(x)=a_nx^n + \\ldots a_1x + a_0.$$\nThen $f(x)= (g(x))^p = (a_nx^n + \\ldots a_1x^n + a_0)^p = a_n^px^{pn} + \\ldots + a_1^px^{p} + a_0^p$. Since $a_k^{p}\\in F$, $a_k\\in F$. So $g(x)\\in F[x]$.\nThis contradicts that $f(x)$ is irreducible. Q.E.D\nThe Galois Group\nExercises\n\n\nGive an example where $Gal(E/F)/Gal(E/B) \\cong G$ where $G$ is a proper subgroup of Gal(B/F).\n\n\nFind the fixed field of the subgroup $\\{ \\alpha_1, \\alpha_4\\}$, where $\\alpha_1(\\xi) = \\xi, \\alpha_4(\\xi)=\\xi^4$. Check that Theorem that $[K:K^G] =|G|$.\n\n\nSolution.  Note that $$(x- (\\xi + \\xi^4))(x - (\\xi^3 + \\xi^2)) = x^2 + x + 1$$\nfrom which we know that $[\\mathbb Q (\\xi + \\xi^4): \\mathbb Q ] =2$.\nSince $[K^G: \\mathbb Q] =2$ and $K^G \\supset \\mathbb Q (\\xi + \\xi^4)$,\nwe know that $K^G = \\mathbb Q (\\xi + \\xi^4)$, from which $[K:K^G]=2=G$. $\\square$\n\nThe Galois group of an irreducible polynomial $f$ is transitive on the set of zeros of $f$.\n\nSolution. If $\\alpha$ and $\\beta$ are two zeros of $f$, then their minimal polynomials are equal. By theorem, there exists $\\gamma$ in the Galois group of $f$ such that $\\gamma (\\alpha) = \\beta$. $\\square$\n", "id": 12, "link_path": "fields.html", "title": "fields", "title_path": "fields"}, {"contents": "\n\nIf the norm of a Gauss integer is the square $p^2$ of a prime number such that $p \\equiv 3\\pmod 4$, then this integer prime $p$ is a Gauss prime.\nProof. If it is not a Gauss prime, then it can be written as $p=\\alpha\\beta$, where $\\alpha,\\ \\beta$ are non-units in the Gauss integers. So $$p^2=N(p)=N(\\alpha)N(\\beta)$$\nSince $\\alpha$ and $\\beta$ are non-units, $N(\\alpha)=p$ and so is $N(\\beta)$.\nLet $\\alpha = a + bi$  ($a,b$ are ordinary integers). Then $p = a^2 +b^2 \\equiv 1 \\pmod 4$, which contradicts the assumption that $p\\equiv 3 \\pmod 4$. $\\square$\n\n\nDescription of Irreducible Elements\n\n\nIf $\\pi$ is a Gauss prime, then we can show that $N(\\pi)$ is either an integer prime or the square of an integer prime.\n\nProof. If $N(\\pi)$ is a prime in $\\mathbb Z$, then there is nothing to prove. If $N(\\pi)$ is factored as prime divisors in $\\mathbb Z$, then each divisor is either an associate of $\\pi$ or $\\bar \\pi$. Suppose $p_1 = u\\pi$ from which $p_2 = u^{-1}\\pi$, where $u=\\pm i, \\pm 1$. So, there are at most two divisors of $N(\\pi)$. If $u=1$, then $u^{-1}=1$. If $u=\\pm i$ or $-1$, then $u^{-1}=-u$. So, the factorization of the norm is given by $N(\\pi)=N(\\pm p_1^2)=p_1^2$.\n(By the way, we have shown that $p_1$ $(=p_2)$ is a Gauss prime.)\n\n\n\nIn other words, if the norm $N(a)$ is not one of these types, the number $a$ is not a Gauss prime.\n\n\nSuppose $N(\\pi)$ is $p$ or $p^2$ ($p$ is an integer prime). If $N(\\pi)=p$, then $\\pi$ is a Gauss prime. Otherwise, if $N(\\pi)=p^2$, then we consider $p\\pmod 4$.\n\nif $p \\equiv 1 \\pmod 4$ (so $p=q \\bar q$ for some Gauss prime $q$), then $\\pi$ is not irreducible because if it is, then $p^2 = q^2\\bar q^2$, from which we get know $p^2$ is not a product of $2$ prime factors, and instead $4$ prime factors in Gauss integers. So $\\pi$ can not be a prime.\nif $p \\equiv 3 \\pmod 4$, then $\\pi$ is a prime.\n$1+i,\\, 1-i,\\, -1-i,\\, -1+i$. are the Gauss Primes with norm 2.\n\n\n\nDivision Algorithm\nWe can round the real and imaginary part of $a+bi = \\frac{a}{q}$ to the closest integer.\n\n\n", "id": 13, "link_path": "Gauss_Integer.html", "title": "Gauss Integer", "title_path": "gauss integer"}, {"contents": "\u5047\u8bbe\u6700\u5c0f\u53cd\u4f8b\u7684\u5b58\u5728\u3002\u90a3\u4e48\u4e0d\u53ef\u80fd\u6709\u91cd\u590d\u81ea\u5df1\u7684item\u5230\u81ea\u5df1\u3002\u56e0\u4e3a\u8fd9\u6837\u4f1a\u7ed9\u51fa\u66f4\u5c0f\u7684\u53cd\u4f8b\u3002\uff08\u6b63\u5e38\u7684\u60c5\u51b5\u5141\u8bb8\u81ea\u5df1\u5230\u81ea\u5df1\uff09\n\u7535\u8bdd\u4e0d\u53ef\u80fd\u91cd\u590d\u3002\u6700\u540e\u4e00\u6b21\u548c\u7b2c\u4e00\u6b21\u7684\u7535\u8bddab\u5bf9a,b\u90fd\u662f\u6700\u540e\u4e00\u6b21/\u7b2c\u4e00\u6b21\u3002\n\u6240\u4ee5\uff0c\u4e0d\u53ef\u80fd\u5f00\u59cb\u548c\u6700\u540e\u4e00\u6b21\u548c\u540c\u4e00\u4e2a\u4eba\u6253\u7535\u8bdd\u3002\u5373\u7b2c\u4e00\u6b21\u548c\u6700\u540e\u4e00\u6b21\u80af\u5b9a\u548c\u4e0d\u540c\u7684\u4eba\u6253\u4e86\u7535\u8bdd\u3002\n\u4f8b  12,34, 23,41\n\u6709\u591a\u5c11\u4e2a\u7535\u8bdd\u662f\u6700\u540e/\u5f00\u59cb\u7684\uff1f\n\n\u5728\u4e0a\u9762\u7684\u4f8b\u5b50\u4e2d\uff0c12, 34 \u90fd\u662f\u9996\u6b21\u300223, 41 \u90fd\u662f\u6700\u540e\u7535\u8bdd\u3002\n\u53ef\u4ee5\u770b\u51fa\uff0c\u524d\u4e24\u4e2a\u4e2d\u56db\u4e2a\u4eba\u7528\u4e24\u6b21\u5b8c\u6210\u4e86\u3002\n\u540e\u4e24\u4e2a\u4e2d\u540c\u6837\u662f\uff0c\u56db\u4e2a\u4eba\u7528\u4e24\u6b21\uff0c\u6bcf\u6b21\u4e24\u4e2a\u4eba\u540c\u65f6\uff0c\u5b8c\u6210\u4e86\u6700\u540e\u7535\u8bdd\u3002\n\n\u4e2d\u95f4\u7684\u7535\u8bdd\n\u4e0d\u662f\u5f00\u59cb/\u6700\u540e\u7684\u7535\u8bdd\uff0c\u53eb\u505a\u4e2d\u95f4\u7535\u8bdd\u3002\n\u5168\u4f53 n \u4e2adon\u5f53\u6210\u8282\u70b9\uff0c\u7ec4\u6210\u4e00\u4e2a\u56fe\u3002\u6bcf\u4e2a\u7535\u8bdd\u662f\u4e00\u4e2a\u8fb9\uff1b\u6ca1\u53c2\u4e0e\u7684\u4eba\u5c31\u662f\u5b64\u7acb\u70b9\uff0c\u81ea\u5df1\u7b97\u4e00\u4e2a\u8fde\u901a\u5206\u652f\u3002\n\u7279\u6b8a\u5730\uff0c\u5728\u8bc1\u660e\u7684\u524d\u63d0\u5185\"0 \u6761\u4e2d\u95f4 call\"\u662f\u53ef\u80fd\u7684\uff0c\u90a3\u5c31\u662f n=5\uff08n\u22125 = 0\uff09\uff1aH \u662f 5 \u4e2a\u5b64\u7acb\u70b9 = \u6070\u597d 5 \u4e2a\u5206\u652f\uff0c\"at least five\" \u6b63\u597d\u53d6\u7b49\u3002\u8fd9\u4e00\u60c5\u5f62\u968f\u540e\u88ab p(a) \u2265 5 \u6392\u6389\u3002\n\u5982\u679cb \u4ecea  \u4f20\u64ad\u4fe1\u606f\uff0c\u90a3\u4e48b \u5728a \u7684\u8054\u901a\u5206\u91cf\u4e2d\u3002\n\u5982\u679c b \u5411a \u4f20\u64ad\u4fe1\u606f\uff0c\u90a3\u4e48b\u5728c\u7684\u8054\u901a\u5206\u91cf\u4e2d\uff0c\u8fd9\u91cc c\u662f\u6700\u540e\u4e00\u4e2aa\u7684\u901a\u8bdd\u5bf9\u8c61\u3002\n\u6240\u4ee5\uff0c\u81f3\u5c11\u67095-2=3 \u4e2a\u8fde\u901a\u5206\u91cf\uff0c\u65e2\u6ca1\u6709\u6765\u81eaa\u7684\u4fe1\u606f\uff0c\u4e5f\u6ca1\u6709\u5411a\u4f20\u9012\u4fe1\u606f\u3002\n\u5bf9\u8fd9\u4e9b\u5206\u91cf\u4e2d\u7684\u8fb9\uff0c\u5bf9a\u800c\u8a00v\u662f\u65e0\u7528\u7684\u3002\n\u8fd9\u4e9b\u5206\u91cf\u4e2d\u7684\u8fb9\u6570$\\le$ \u5bf9a\u800c\u8a00\u65e0\u7528\u7684\u7535\u8bdd\u3002\n\u5148\u533a\u5206\u201c\u4f20\u9012\u6765\u81eaa\u4fe1\u606f\u201d\u548c\u201c\u5411a\u4f20\u9012\u4fe1\u606f\u201d\u4e24\u79cd\u7535\u8bdd\u3002\n\u5728 AB, CD, AC, BD\uff08k=4\uff0c\u53d6 a=A\uff09\u91cc\uff0c\u6807\u8bb0\u4e24\u4e2a\u65b9\u5411\uff1a\n\u901a\u8bdd\tfrom A\uff08\u4f20 item A\uff09\tto A\uff08\u4fe1\u606f\u6d41\u5411 A\uff09\n1 AB\t\u2713\uff08B \u7b2c\u4e00\u6b21\u77e5\u9053 A\uff09\t\u2713\uff08B \u7684 item \u7acb\u523b\u5230 A\uff09\n2 CD\t\u2717\t                                   \u2713\uff08D \u7ecf\u540e\u9762 AC \u5230 A\uff09\n3 AC\t\u2713\uff08C \u7b2c\u4e00\u6b21\u77e5\u9053 A\uff09\t\u2713\uff08C\u3001D \u7684 item \u5230 A\uff09\n4 BD\t\u2713\uff08D \u7b2c\u4e00\u6b21\u77e5\u9053 A\uff09\t\u2717\uff08\u4e4b\u540e\u6ca1\u6709\u901a\u8bdd\u80fd\u5230\u8fbe A\uff09\n\u6240\u4ee5\n\nF = {AB, AC, BD}\nT = {AB, CD, AC}\nF\u2229T = {AB, AC}\n\u5373 a=A \u4eb2\u81ea\u6253\u7684\u90a3\u4e24\u901a\uff0c\u6b63\u597d\u90fd\u540c\u65f6\u5c5e\u4e8e\u4e24\u4e2a\u65b9\u5411\uff1b\u800c p(A)=2\uff0c\u6240\u4ee5 |F\u2229T| = 2 = p(A)\uff08\u6ee1\u8db3 |F\u2229T| \u2264 p(a)\uff09\u3002\n\u987a\u5e26\u9a8c\u7b97\u4e00\u4e0b\u8fd9\u6761\u5f0f\u5b50\uff1ak=4\uff0c|F|=n\u22121=3\uff0c|T|=3\uff0c|F\u2229T|=2\uff0cw(a)=0\uff08\u65e0\u6d6a\u8d39\u901a\u8bdd\uff09\uff0c\n4 \u2265 3 + 3 \u2212 2 + 0 = 4 \u2713\n\u8fd9\u91cc\u53d6\u7b49\u53f7\uff0c\u56e0\u4e3a\u5b83\u662f\u53ef\u884c\u7684\u6700\u4f18\u65b9\u6848\uff08k=2n\u22124\uff09\uff0c\u4e0d\u662f\u4e66\u4e2d\u90a3\u4e2a\u5047\u60f3\u7684 k=2n\u22125 \u53cd\u4f8b\u3002\n\nnohoi \u5bfc\u81f4\uff0c\u53ea\u6709a\u672c\u4eba\u53c2\u4e0e\u7684\u7535\u8bdd\uff0c\u624d\u6709\u53ef\u80fd\u540c\u65f6\u7b26\u5408\u4e24\u79cd\u3002\uff08\u4e3a\u4ec0\u4e48\uff1f\uff09\n\u6240\u4ee5\uff1a# \u201c\u4f20\u9012\u6765\u81eaa\u4fe1\u606f\u201d$\\cap$  #\u201c\u5411a\u4f20\u9012\u4fe1\u606f\u201d $\\le$  # a \u672c\u4eba\u6253\u7684\u7535\u8bdd\n\u6211\u4e0d\u4f1a\n", "id": 14, "link_path": "gossip_problem.html", "title": "gossip problem", "title_path": "gossip problem"}, {"contents": "Connectedness\n\n\nQuestions\n#. When does a graph exist an Eulerian path, along which each edges repeat at most twice?\n\n\n\n", "id": 15, "link_path": "Graph_Theory.html", "title": "Graph Theory", "title_path": "graph theory"}, {"contents": "#. Find all finite groups in which the number of classes of conjugate elements is equal to $2$.\nProof. This group is the group of order $2$. The size of the conjugacy class $C$ that is not the identity element divides the size of group, $n$, from which  $n-1 \\mid n$. Since $n-1$ and $n$ are coprime, we conclude that $n-1 \\mid 1 = n - (n - 1)$ (Bezout\u0027s lemma). So $n-1=1$.\n#. Find all finite groups in which the number of classes of conjugate elements is equal to $3$.\nProof. First we need to determine the possible sizes of the conjugacy classes. When is this group $S_3$\n#. Find a generator of $A_n$ when $n\\geq 2$.\n", "id": 16, "link_path": "group_theory.html", "title": "group_theory", "title_path": "group_theory"}, {"contents": "You want to simplify the function, not just the integral region.\nFor trig functions, consider the identities that reduce the sum of sins and cos into one trig functions.\nExample Compute $$\\int_{x^2 + y^2 \\leq 1}|x^2 -y^2|dxdy$$\nHint. $\\sin^2(x)=?$\n", "id": 17, "link_path": "Integrals_involving_Absolute_Values.html", "title": "Integrals involving Absolute Values", "title_path": "integrals involving absolute values"}, {"contents": "[under construction]\nLet $e_1 = 1,\\, e_2=x,\\, e_3=x^2$. The invariant subspaces wrt $\\Delta$ of $V$ are\n$W_1={\\rm span}(e_1), W_2={\\rm span}(e_1, e_2), W_3= {\\rm span}(e_1, e_2, e_3)$\nProof. Let $W$ be an invariant space of $W$ wrt $\\Delta$.\nSuppose $W_j$ is the maximal subspace in $\\{W_k\\}_{k=1,2,3}$ that contains $W$. Then we can show that $W$ contains $W_j$ as well. So $W=W_j$.\n", "id": 18, "link_path": "Invariant_Subspace.html", "title": "Invariant Subspace", "title_path": "invariant subspace"}, {"contents": "Independent Aftermath 1\n\ntoday I read the first question in the Chapter 8 \u0027independent aftermath\u0027  in the book \"Conversational problem Solving\". I wonder why is the probability \"symmetric\" for different $x_i$.\n\nI think the reason is that $p_i$ is the probability of Rebecca (in any ways) going to the one of the adjacent of $x_i$ then moving to the other adjacent of $x_i$,  the length of which adds up to the same number  n-1 all $x_i$, $2\\leq i \\leq n$\nRegarding the question above, I think the reason is that since Rebecca will eventually move to an adjacent of $x_i$, the probability of this event is 1. Therefore, conditioning on this event yields the same probability as $p_i$. (18:25)\n\nGraph\n\nIn the proof that an Euler walk exists if and only every vertex has an even degree (Theorem 1.8.1 in https://www.math.uni-hamburg.de/home/diestel/books/graph.theory/preview/Ch1.pdf), a subtle step is the following: if an edge is in $G-E(W)$, then there exists (possible another) edge $e$ incident to a vertex in in $W$.\nThen, the connected component $C$ of $e$ in $G\u0027$ is a smaller connected graph with even degrees. (It has to have fewer edges than $G$ does because $G\u0027$, where this component lies, is already much short of edges than $G$.) So, by induction hypothesis, $C$ has an Euler walk. Concatenation of it with $W$ finishes the proof.\n\n\n", "id": 19, "link_path": "journals/2025_11_20.html", "title": "2025_11_20", "title_path": "journals/2025_11_20"}, {"contents": "\nWhy is $\\gamma[ab]$ the identity when the fundamental group is abelian? [[Algebraic Topology]]\n\nI understood that this is because $\\gamma[ab]$ is a fundamental group element..\n\n\n\n", "id": 20, "link_path": "journals/2025_11_21.html", "title": "2025_11_21", "title_path": "journals/2025_11_21"}, {"contents": "\nSomething interesting to know: the map $x\\to x^p$ is a field homomorphism for any field of characteristic $p$, and so it is injective (field homomorphism = injective homomorphism).\n\nIt is surjective in finite field of characteristic $p$ because it is additionally a linear map. In fact, it is surjective on all perfect fields of characteristic $p$.\n\n\n\n\n", "id": 21, "link_path": "journals/2025_11_22.html", "title": "2025_11_22", "title_path": "journals/2025_11_22"}, {"contents": "\nSurprisingly, $x^p -a$ is either irreducible or has roots in the field even for field $K$ with ${\\rm char} K\\neq p$.\n\nI accidentally wrote a proof for this with condition ${\\rm char} K =p$, without realizing this has nothing to do with the characteristic of the field. [[Exercises in Field Theory]]\nhttps://math.stackexchange.com/questions/266171/irreducibility-of-a-polynomial-if-it-has-no-root-capelli/266239#266239\n\n\n\n\n\n", "id": 22, "link_path": "journals/2025_11_23.html", "title": "2025_11_23", "title_path": "journals/2025_11_23"}, {"contents": "\nThe Lagrange mean value theorem: Prove $f(\\xi) + f(\\zeta)=0$\n\n\n", "id": 23, "link_path": "journals/2025_11_25.html", "title": "2025_11_25", "title_path": "journals/2025_11_25"}, {"contents": "\n[Descend Argument](../Descend Argument)\nRecall that for all positive $\\epsilon$, $x^\\epsilon$ is $o(\\ln(x))$ as $x\\to 0$.\n\nthat is, $\\lim_{x\\to 0}x^\\epsilon\\ln (x)$.\nSo, $\\lim_{x\\to 0} \\frac{x\\ln(x)}{x^{1-\\epsilon}} =\\lim_{x\\to 0} x^\\epsilon \\ln (x) = 0$.\nMore roughly, we can say that $x\\ln(x) = O(x^{1-\\epsilon})$ for $|x| \u003c\\delta$.\nNotice that when $\\epsilon \u003e1$, everything above is still valid. (Why?)\nAnd it is not correct to say $\\color{red}x\\ln(x) =O(x) (\\quad \\rm incorrect)$\n\n\n\nToday I learned that Orbit Stablizer Theorem is about an orbit (of the conjugacy action of $G$ on a single element).\nThis helps to find the number of centralizer (the elements that commute with a group elment $x$). The  orbit of the action on $x$ is the conjugacy class and the stablizer is the centralizer. The conjugacy class of $x\\in S_n$ is easy to find. So the stablizer (e.g. centralizer) is easy to find.\n\n\n", "id": 24, "link_path": "journals/2025_11_26.html", "title": "2025_11_26", "title_path": "journals/2025_11_26"}, {"contents": "Orthogonal Projection\n\nI computed matrix of the adjoin operator $T^*$  under an orthonormal matrix, showing that it is the transpose matrix of $T$ under the same basis when they are over $\\mathbb R$ .\nThe adjoin operator of the restriction of an operator can be computed, too, via projection.\n\n\n\nTwo things I don\u0027t understand\n\nWhy is $V$ necessarily spanned by two eigenvectors, as the solution claims?\nlogseq.order-list-type:: number\n\nanswer: ((6932e5e1-39b7-450d-b428-3f1afad9e70e))\nlogseq.order-list-type:: number\n\n\nHow is the projection operator used? Did it simplify the calculation?\nlogseq.order-list-type:: number\n\nIt computed the projection of $A^t \\alpha$ unto $V$. No.\n\n\n\n\n\n\n\n\n2026-11-12: I just revisited this question. do not know what it says or the solution itself.\nThen i seem to realize what it means.\n$L_A \\alpha - A^t \\alpha$ is orthogonal to $\\beta_1,\\,\\beta_2$.\nSo, it is in the space $V^\\top$ spanned by the vector orthogonal to both $\\beta_1$ and $\\beta_2$ .\nA spanning vector of $V^\\top$ is $(1 \\quad -1\\quad 0)^\\top$.\nLet $v = (1 \\quad -1  \\quad 0)^\\top$ and $v_n = \\frac{1}{\\sqrt 2} (1 \\quad -1  \\quad 0)^\\top$ is its normalization.\n$$\\begin{align*}\n\u0026 (1 \\quad 3 \\quad -1)\\ v_n \\cdot v_n \\\\\n=\\ \u0026 \\frac{1}{2}\\ (1 \\quad 3 \\quad -1)\\ \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix} \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix} \\\\\n=\\ \u0026 \\frac{1}{2} \\times 2\\ \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix}  \\\\\n=\\ \u0026 \\begin{pmatrix}1 \\\\ -1 \\\\ 0 \\end{pmatrix}\n\\end{align*}$$\nSo the answer is\n$$\\begin{pmatrix} 1 \\\\ 3 \\\\ -1 \\end{pmatrix} - \\begin{pmatrix} -1 \\\\ 1 \\\\ 0 \\end{pmatrix} = \\fbox {$\\begin{pmatrix} 2 \\\\ 2 \\\\ -1 \\end{pmatrix}$}.$$\n", "id": 25, "link_path": "journals/2025_12_01.html", "title": "2025_12_01", "title_path": "journals/2025_12_01"}, {"contents": "Invariant Space\nid:: 6932e5e1-39b7-450d-b428-3f1afad9e70e\n- Every invariant Space of $T\\in \\mathcal L(T)$  is a direct sum of spaces spanned by eigenvectors if  $T$ is diagonalizable. Suppose $V$ is an invariant space of $T$.\n- The idea is  to show $V=\\oplus (V\\cap V_\\lambda)$\n- Of course, $\\subset$ is obvious.\n- On the other hand, if $v = v_1 + \\ldots + v_n$, where $v_i$ are eigenvectors with different eigenvalues, then we need to show $v_i \\in V$ for each $i$. Use lagrange interpolation to construct  a polynomial. $f(\\lambda_k)=1$ if $k=i$ and $0$ otherwise. Thus $f(T)v_k = f(\\lambda_k)v_k$. This gives $f(A)v=v_i$. So $v_i \\in V$ by the invariance of $V$.\n- For a general $T\\colon: V\\to V$, an invariant space is a direct sum of spaces spanned by general eigenvectors. I do not know how this is done exactly.q\n\n\nLower Bound of Unipotent Matrix\n\nFor $A$ a matrix, if $A-I$ is nilpotent, then $A$ is said to be unipotent.\nDefine $\\|A\\| = \\max |a_{ij}|$. Then $\\|A\\|$ is lower bounded by $1$. Surprisingly, this can be proved using trace. In fact, there is at least one diagonal entry whose absolute value is not less than $1$.\nA thing I didn\u0027t grasp is that the trace is equal to the sum of eigenvalues counting the multiplicity. For the power, the trace is the sum of eigenvalues taken the power, counting the multiplicity.\n\n\n$$\\mathrm{trace} A^n= \\sum \\lambda_i^n$$\n\n\nThis is clear from the Jordan canonical form and I do not know how can one show this without JCF.\nThe upper bound of $\\|A^j\\|$ is $Kj^m$, where $K$ is a positive constant.\n\n\n\nGluing Lemma\n\nFor $X\\subset \\mathbb R^n$, if $X=A\\cap B$ and $A,B$ are closed sets, and $f\\mid A$, $f\\mid B$ are both continuous, then $f$ is continuous.\nI saw that this condition can be weakened to Hausdorff space, but I didn\u0027t look into it.\nThis lemma is useful for algebraic topology.\n\n\n\n\n", "id": 26, "link_path": "journals/2025_12_05.html", "title": "2025_12_05", "title_path": "journals/2025_12_05"}, {"contents": "The Little Learner\n\ntensor addition, multiplication: element-wise.\n$\\theta$ : the training history. You update it on each revision using the  law\n\nnew $\\theta_0$ = $\\theta_0$ - ($\\alpha \\times$ rate of change of loss wrt $\\theta_0$)\n\n\nrank of tensor: sum reduces the rank of tensor by 1.\ntensor^1, tensor^2.. are the notations to denote the rank of tensors.\npackages: Racket, malt\n\n\n", "id": 27, "link_path": "journals/2025_12_08.html", "title": "2025_12_08", "title_path": "journals/2025_12_08"}, {"contents": "Limit of Derivative of Different Orders\n\nWithout monotonicity, the limit of a function cannot be studied abstractly (i.e. using the certain existence theorems), because all existence theorems require monotonicity.\nDONE I will translate The Odyssey # 350.\u23f1 1s \u00b7 1 entry2025-12-12 Fri 11:13:33\u21922025-12-12 Fri 11:13:341s\nDONE Do the math question assigned by Gemini\u23f1 75h 14m \u00b7 1 entry2025-12-12 Fri 11:13:37\u21922025-12-15 Mon 14:28:1475h 14m 37s\nTODO Xiao p44-50 (goal). At least study it for 1h.\u23f1 1s \u00b7 1 entry2025-12-12 Fri 10:59:56\u21922025-12-12 Fri 10:59:571s\nDONE [[Dec 13th, 2025]] shower\u23f1 1s \u00b7 1 entry2025-12-15 Mon 14:28:26\u21922025-12-15 Mon 14:28:271s\n\n\n\n", "id": 28, "link_path": "journals/2025_12_12.html", "title": "2025_12_12", "title_path": "journals/2025_12_12"}, {"contents": "\ndeterminant: adding sides method to compute determinants.\ncalculus: intermediate value theorem. For the linear type of questions with constant coefficients, we can construct the function just like we do in for ODE.\nAbelian Fundamental Group: the isomorphism map of isomorphic fundamental groups, in this case, has only one  possibility --\n\nsuppose $x$ and $y$ are two base points, and $\\alpha$ and $\\alpha^\\prime$ are two paths connecting $x$ and $y$.\nIn this case, $[\\alpha(\\alpha^\\prime)^{-1}] \\in \\pi(y)$\n$\\alpha \\circ {\\alpha^\\prime}^{-1} = id_{\\pi(y)} \\implies \\alpha = \\alpha^\\prime$\n\n\n\n\n\n", "id": 29, "link_path": "journals/2025_12_15.html", "title": "2025_12_15", "title_path": "journals/2025_12_15"}, {"contents": "\nwhat am i even thinking about?\n\n\n", "id": 30, "link_path": "journals/2026_06_24.html", "title": "2026_06_24", "title_path": "journals/2026_06_24"}, {"contents": "\nIn the writeblog, how to test the behaviors? One  way is to let AI write test cases. That might be handy. For example, the passing of parameter might be missed, which causes errors.\nI didn\u0027t sleep last night after 2 am and fixed problems in the writeblog code. It was merely recreational.\n\n\n\n", "id": 31, "link_path": "journals/2026_06_25.html", "title": "2026_06_25", "title_path": "journals/2026_06_25"}, {"contents": "\nLet ( p ) be a prime number and ( n ) a natural number such that ( \\sqrt{n(n + p)} ) is an integer. Prove that ( n ) is a perfect square.\n#machine-learning sigmoid nn rarely dies: we can continuously change the weight. constant linear layer + $\\epsilon$ change in weight along $x^{(\\ell -1)}(x1) - x^{(\\ell - 1)}(x_2) \\neq 0$ = non-constant linear layer\n\n\n\n", "id": 32, "link_path": "journals/2026_06_27.html", "title": "2026_06_27", "title_path": "journals/2026_06_27"}, {"contents": "\nfour quadrant: urgency\ntrigger, behaviour, reward,\nTBR strategy\ntrigger strong\nearn the reward\ndefine the \u0027done\u0027\nYou can only do one thing at a tim\n\n", "id": 33, "link_path": "journals/2026_06_28.html", "title": "2026_06_28", "title_path": "journals/2026_06_28"}, {"contents": "\ndesign system \u0026 UI kit\natomic design\nprototype\n\ncomponent\n\nmaster, instances. the characteristics of instances inherit the master\nauto layout.\n\n", "id": 34, "link_path": "journals/2026_07_08.html", "title": "2026_07_08", "title_path": "journals/2026_07_08"}, {"contents": "\nwhy #LinUCB works\n\nthe exploration term comes from Cauchy inequality and covariance. Although it seems to ignore the ridge term (?)\nthe exploitation term comes from ridge regression\n\n\n\n\n\n", "id": 35, "link_path": "journals/2026_11_13.html", "title": "2026_11_13", "title_path": "journals/2026_11_13"}, {"contents": "\nQ: What is the largest number of points on the plain, each two of which have the equal $\\ell_1$ distance?\n\nIf $x \\in B(y)$, then $B(x) \\cap B(y) \\leq 2$. Where $B()$ is the $\\ell_1$ ball of the plane.\n\nIf $x,\\ y$  have \\ell 1 distance $d$, what is the number of other points having the equal distance from $x$ and $y$?\nThe answer is $2$, as the inequality above asserts.\n\n\nSo, the maximal number of pairwise $\\ell_1$-equidistant points on $\\mathbb R^2$ is $\\boxed 4$.\n\n\nDONE dual and support vectors t10 task 4\u23f1 7s \u00b7 10 entries \u00b7 1 open2026-11-15 Sun 20:06:21\u21922026-11-15 Sun 20:06:221s2026-11-15 Sun 20:06:23\u21922026-11-15 Sun 20:06:230s2026-11-15 Sun 20:06:24\u21922026-11-15 Sun 20:06:251s2026-11-15 Sun 20:06:26\u21922026-11-15 Sun 20:06:271s2026-11-15 Sun 20:06:28\u21922026-11-15 Sun 20:06:291s2026-11-15 Sun 20:06:29\u21922026-11-15 Sun 20:06:301s2026-11-15 Sun 20:06:31\u21922026-11-15 Sun 20:06:310s2026-11-15 Sun 20:06:32\u21922026-11-15 Sun 20:06:320s2026-11-15 Sun 20:06:33\u21922026-11-15 Sun 20:06:352s2026-11-15 Sun 20:06:37\u2192openrunning\ndual form. For SVM, $\\bm w=\\sum \\alpha_i y_i  \\bm x_i$\nhessian is negative semi-definite =\u003e function is concave\nHard margin SVM =\u003e support vector is on the boundary. We can use this to compute $b$.\nfull margin is $\\frac{2}{\\|w\\|_2}$. Primal objective is $\\frac{1}{2} \\|w\\|_2$.\n\n\nTODO https://distill.pub/2019/paths-perspective-on-value-learning/ \u60f3\u4e00\u4e0b\u600e\u4e48\u53ef\u89c6\u5316\u81ea\u5df1\u7684rl\u9879\u76ee\u23f1 1h 31m \u00b7 2 entries2026-11-15 Sun 23:34:53\u21922026-11-16 Mon 00:35:301h 37s2026-11-16 Mon 00:35:38\u21922026-11-16 Mon 01:06:2030m 42s\nTODO approximate \ud835\udc44-learning\u23f1 1h 36m \u00b7 2 entries2026-11-15 Sun 23:35:11\u21922026-11-16 Mon 00:35:391h 28s2026-11-16 Mon 00:35:44\u21922026-11-16 Mon 01:11:4936m 5s\n\n\n", "id": 36, "link_path": "journals/2026_11_15.html", "title": "2026_11_15", "title_path": "journals/2026_11_15"}, {"contents": "\nTODO write report section about UCB policy_improved\u23f1 2h 2m \u00b7 8 entries \u00b7 2 open2026-11-16 Mon 19:33:06\u21922026-11-16 Mon 19:33:060s2026-11-16 Mon 19:33:26\u2192openrunning2026-11-16 Mon 19:36:14\u21922026-11-16 Mon 19:42:426m 28s2026-11-16 Mon 19:42:44\u21922026-11-16 Mon 19:42:495s2026-11-16 Mon 19:42:49\u2192openrunning2026-11-16 Mon 19:59:42\u21922026-11-16 Mon 20:21:4222m2026-11-16 Mon 20:21:44\u21922026-11-16 Mon 21:11:1849m 34s2026-11-16 Mon 21:19:29\u21922026-11-16 Mon 22:04:2044m 51s\nhttps://yhwu-is.github.io/Teach/ec/data_market/2026/lec05-mab.pdf\nthe selection happens on the last line https://github.com/kfoofw/bandit_simulations/blob/master/python/multiarmed_bandits/analysis/ucb.md\n\n\n\n\n\n\n", "id": 37, "link_path": "journals/2026_11_16.html", "title": "2026_11_16", "title_path": "journals/2026_11_16"}, {"contents": "\nTODO dataset handling. for recommendation data especially\nTODO decide whether i use macro/micro-F1 or not\n\n\n", "id": 38, "link_path": "journals/2026_11_17.html", "title": "2026_11_17", "title_path": "journals/2026_11_17"}, {"contents": "The plan of lang stat project.\nFollow methods in https://allendowney.github.io/ThinkBayes2/\nInitialization\nFind a suitable data of language text and download it. Suitable for unsupervised data analysis, such as cluster etc.\nProblems\nWhat are noticable features in the language corpus?\nHow to ask good stat questions (Key Principles \u0026 Rules)\nAt its core, asking a good statistical question means translating real-world uncertainty or business needs into a measurable, testable, and decision-driven statistical proposition. If the question itself is vague or biased, even the most advanced machine learning models or statistical tests will fail\u2014a classic case of \"Garbage in, garbage out.\"\nWhen formulating a statistical question, follow these 6 essential rules:\nRule 1: Make it Specific \u0026 Measurable\nAvoid subjective, vague, or loose terms (such as \"good,\" \"much,\" or \"significantly improved\"). Define clear, quantitative metrics instead.\n\n\nPoor Question: \"Is our new landing page doing well?\"\n\n\nGood Question: \"Over the 14 days following release, did the new landing page yield a statistically significant increase ($\\ge 2\\%$) in daily paid conversion rates among users aged 25\u201334 compared to the old page?\"\n\n\nRule 2: Clearly Define the Population \u0026 Sample Scope\nStatistical inferences apply only to the specific population under study. Explicitly define the target audience, timeframe, and geographical or platform bounds to avoid overgeneralization.\n\n\nPoor Question: \"Which recommendation algorithm do users prefer?\"\n\n\nGood Question: \"Among active iOS mobile users over the past 30 days, does Algorithm A achieve a higher mean 1-day retention rate than Algorithm B?\"\n\n\nRule 3: Remain Unbiased \u0026 Neutral\nA well-formulated statistical question must not presuppose an answer or lead the data toward a specific conclusion.\n\n\nPoor Question: \"Why are most users satisfied with our new feature?\" (Presupposes widespread satisfaction)\n\n\nGood Question: \"What is the distribution and median of overall satisfaction scores among a random sample of 1,000 users who tried the new feature?\"\n\n\nRule 4: Ensure Testability \u0026 Falsifiability\nA statistical question should translate into formal null ($H_0$) and alternative ($H_1$) hypotheses that can be rejected or failed to be rejected based on observed data.\n\n\nPoor Question: \"Is product quality the fundamental driver of sales volume?\" (Too broad and difficult to isolate)\n\n\nGood Question: \"After controlling for ad spend and seasonality, is there a statistically significant negative correlation ($p \u003c 0.05$) between product return rates (a proxy for quality) and repeat purchase rates?\"\n\n\nRule 5: Distinguish Association from Causation\nClarify whether you are asking a descriptive question, looking for a statistical association, or attempting to establish a causal relationship. Causal questions require controlled experimental designs (e.g., A/B testing).\n\n\nAssociation: \"Is daily active time positively correlated with total monthly spend?\"\n\n\nCausation: \"Does issuing a $5 discount coupon (treatment) cause a statistically significant increase in average 30-day spending compared to the control group?\"\n\n\nRule 6: Aim for Practical Significance \u0026 Actionability\nStatistical significance ($p \u003c 0.05$) does not always translate to practical business significance. The answer to a good statistical question should directly inform a specific decision or action.\n\n\nPoor Question: \"Is the 0.001-second difference in click response time between Group A and Group B statistically significant?\" (Technically testable, but practically meaningless)\n\n\nGood Question: \"Does reducing page load time by 500ms using the new compression algorithm increase conversion rates by at least 0.5% with statistical significance?\"\n\n\nChecklist for Evaluation\nBefore finalizing your statistical question, evaluate it against this checklist:\n\n\n\nDimension\nSelf-Check Question\n\n\n\n\nMetrics\nAre the independent (input) and dependent (output) variables clearly defined?\n\n\nPopulation\nAre the boundaries (time, user segment, platform) explicitly stated?\n\n\nTestability\nCan this be proved or disproved using a hypothesis test or mathematical model?\n\n\nFeasibility\nDo you have access to sufficient data and sample size to answer the question?\n\n\nActionability\nWill the outcome (reject or fail to reject $H_0$) trigger a clear next action?\n\n\n\nBuilding\nImplement the code while leaving a few essential blanks for the user to fill, for the educational purpose.\nDesigning code completion exercises (fill-in-the-blank code) for statistics requires balancing pedagogical focus, syntax constraints, and statistical comprehension. The goal is to test whether students understand the statistical concept and API logic, not whether they can guess arbitrary variable names.\nBelow are the core rules and strategies for creating effective fill-in-the-blank statistics exercises.\nCore Rules for Designing Blank Spaces\nRule 1: Target Statistical Logic, Not Boilerplate\nLeave blanks where students must demonstrate understanding of statistical concepts (e.g., choosing the correct distribution function, formula, parameter, or evaluation metric). Keep setup, data loading, and syntax boilerplate intact.\n\n\nPoor: import _____ as pd (Tests basic Python syntax, not statistics)\n\n\nBetter: ttest_ind(group_a, group_b, alternative=\u0027_____\u0027) (Tests hypothesis directionality)\n\n\nRule 2: Ensure Unambiguous Answers\nA blank should ideally have one canonical correct answer (or a very narrow set of equivalents). Avoid blanks where multiple valid approaches could fit unless your grading system explicitly supports regular expressions or AST parsing.\n\n\nAmbiguous: df[\u0027height\u0027].____() (Could be .mean(), .median(), .std(), etc.)\n\n\nUnambiguous: # Compute the 95th percentile $\\rightarrow$ np.percentile(df[\u0027height\u0027], ____)\n\n\nRule 3: Maintain Code Structure \u0026 Executability\nThe surrounding code should remain syntactically valid around the blank. Use consistent placeholder notation that indicates what type of input is expected.\n\n\nStandard Placeholders:\n\n\n___ (three underscores) for general code gaps.\n\n\n/* YOUR CODE HERE */ for multi-character or expression-level gaps.\n\n\nNone or ... (Ellipsis in Python) if the code needs to remain syntactically valid before student edits.\n\n\n\n\nKey Categories of Statistical Blanks (With Examples)\n1. Statistical Distributions \u0026 Parameters\nTest whether students understand which distribution function to use (pdf/pmf, cdf, or ppf/qnorm) and how parameters map to theoretical concepts.\n\n\nR Example (Normal Distribution Quantiles):\nR\n# Find the z-score corresponding to the 97.5th percentile of N(0,1)\nz_crit \u003c- qnorm(p = ____, mean = 0, sd = 1)\n\n\n\nPython Example (Binomial PMF):\nPython\nfrom scipy.stats import binom\n# Probability of getting exactly 5 heads in 10 fair coin flips\nprob = binom.pmf(k=5, n=10, p=____)\n\n\n\n2. Hypothesis Testing \u0026 Decisions\nFocus on test selection, hypothesis directionality (alternative), or decision rules based on $\\alpha$ and $p$-values.\n\n\nPython Example (T-Test Directionality):\nPython\n# Test if Group A mean is significantly GREATER than Group B\nstat, p_val = ttest_ind(group_a, group_b, alternative=\u0027____\u0027)\n\n\n\nR Example (Decision Rule):\nR\nalpha \u003c- 0.05\n# Reject Null Hypothesis if p-value is below significance level\nif (p_val ____ alpha) {\n  print(\"Reject H0\")\n}\n\n\n\n3. Formula Specifications in Modeling\nIn regression models, leave blanks for formula design (e.g., interaction terms, log transformations, or random effects).\n\n\nR Example (Linear Model with Interaction):\nR\n# Fit a model predicting yield using temp, fertilizer, and their interaction\nmodel \u003c- lm(yield ~ temp ____ fertilizer, data = crop_data)\n\n\n\n4. Data Transformation \u0026 Filtering\nTarget key statistical operations like standardizing ($Z$-score conversion), grouping, or pivoting.\n\n\nPython Example (Standardization):\nPython\n# Standardize variable X: (X - mean) / std\nz_scores = (df[\u0027X\u0027] - df[\u0027X\u0027].mean()) / df[\u0027X\u0027].____()\n\n\n\nBest Practices for Scaffolding \u0026 Grading\n\n\nProvide Clear Context via Comments: State the statistical goal directly above the code block. Do not force students to reverse-engineer the prompt from incomplete syntax.\n\n\nOne Concept Per Line: Avoid putting multiple blanks on a single line unless testing a closely coupled concept (e.g., mean and sd together).\n\n\nUse Expected Output Annotations: Include expected output or assertion tests directly below the exercise so students can self-check:\nPython\nmean_val = df[\u0027age\u0027].____()\n# Assert for automated autograding environments\nassert np.isclose(mean_val, 34.25), \"Check your calculation method!\"\n\n\n\nSummary Checklist for Instructors\n\n\n\nCriterion\nCheck\n\n\n\n\nFocus\nDoes the blank test a statistical concept rather than general programming syntax?\n\n\nUniqueness\nIs there a single, unambiguous correct answer for the blank?\n\n\nClarity\nIs the prompt comment explicit about what value/function is required?\n\n\nScaffold\nIs all necessary data preprocessing provided prior to the blank?\n\n\nValidation\nIs there an automated check or expected output provided for student feedback?\n\n\n\n", "id": 39, "link_path": "lang_stat.html", "title": "lang stat", "title_path": "lang stat"}, {"contents": "\n\nBasics\n$\\lim_{n\\to \\infty} (1+1/n)^{1/n} = e$\nEstimate $1 + \u00bd + 1/3! + \\ldots + 1/n!$\n\n\nUpper Bound\nIf $a_1, a_2 \\ldots$ are positive real numbers, prove\n$$\\limsup_{n\\to \\infty} \\left(\\frac{1 + a_{n+1}}{a_n}\\right)^n \\geq e$$\n\u8fd9\u4e2a\u5e8f\u5217\u4e2d\uff0c\u6bd4\u5c0f\u4e8e $\\sqrt[n]{e}$ \u4e0d\u53ef\u80fd\u6c38\u8fdc\u6301\u7eed\u4e0b\u53bb\u3002\n\u603b\u662f\u53ef\u4ee5\u627e\u5230 subsequence \u4f7f\u5f97\u6781\u9650\u7b49\u4e8e\u67d0\u4e2a\u5927\u4e8e\u7b49\u4e8e $e$ \u7684\u6570\u3002\n\u5bf9\u8fd9\u79cd\u62bd\u8c61\u7684\u5e8f\u5217\uff0c\u6211\u4eec\u552f\u4e00\u77e5\u9053\u5b83\u6837\u5b50\u7684\u529e\u6cd5\u662f\u5bf9\u5b83\u505a\u8fed\u4ee3\u3002\n\u600e\u4e48\u627e\u5230\u5408\u9002\u7684\u8fed\u4ee3\u65b9\u5f0f\uff1f\n\n\nProduct\nFor a limit of products, it is natural to take logarithm and estimate the summation.\n$$\\lim_{n\\to \\infty} \\frac{(1\\cdot 2^2 \\cdot \\ldots \\cdot n^n)^{\\frac{1}{n^2}}}{n^{1/2}} = e^{\\frac{1}{4}}$$\nWe estimate the upper bound of $\\frac{1}{n^2} \\sum^n_{k=2} k\\ln (k)$ .\nNotice that $f(x)=x\\ln x$ is monotone increasing.\nUpper bound: $$\\sum^n_{k=2} k \\ln k \\leq \\int^{n+1}_{2} x \\ln x dx \\leq \\int^{n+1}_{1} x \\ln x dx$$ Lower bound:\n$$\\int^{n}_{1} x \\ln x dx \\leq \\sum^{n}_{k=2} k \\ln k$$\nThe difference of upper bound and the lower bound is $O(n\\ln n)$.\nThe error is bounded by\n$$\\rm upper\\ bounded - lower\\ bound$$\n\nVisually, the error is bounded above by the tail: the area below the curve of the function $f(x)$ on $[n,n+1]$; this area is at most $f(n+1)$.\n\nThat is, $$\\sum^n_{k=2} k \\ln k  = \\int^{n+1} _1 x  \\ln x  + O\\left(\\int^{n+1}_n x\\ln x \\right)dx =\\int^{n} _1 x  \\ln x  + O\\left(n\\ln(n)\\right)$$\nbecause\n$$\\int^{n+1}_nx\\ln(x)dx \\leq (n+1) \\ln(n+1) = O(n)(\\ln(n) + \\ln(\\frac{n+1}{n}))= O(n)O(\\ln n) = O(n\\ln n)$$as $n\\to \\infty$, from which it follows that (1) equals $$\\frac{1}{n^2}\\left(\\frac{1}{2}n^2 \\ln n - \\frac{1}{4} n^2 + O(n\\ln n)\\right)$$.\nSo the logarithm of the original function is $$\\frac{1}{2}\\ln n - \\frac{1}{4} + O\\left(\\frac{\\ln n}{n^2}\\right) - \\frac{1}{2}\\ln n \\to \\frac{1}{4}$$\nand so the limit is $\\exp(1/4)$.\nA stronger(?) tool for handling summations is Euler-Maclaurin Expansion.\n\n\n", "id": 40, "link_path": "Limit_involving_e.html", "title": "Limit involving e", "title_path": "limit involving e"}, {"contents": "Question\n\nFind the value $a$ such that $Ax=\\vec b$ has zero/infinite/unique solutions,\nwhere $A=\\begin{pmatrix} \\lambda \u0026 1 \u0026 1 \\\\ 1 \u0026 \\lambda \u0026 1 \\\\ 1 \u0026 1 \u0026 \\lambda\\end{pmatrix}$, $\\vec b=\\begin{pmatrix} a \u0026 b \u0026 c \\end{pmatrix}^t$.\n\nConsider different $a,b,c$.\n\nWhat is a sufficient condition for three points in $\\mathbb R^2$ to be on the same line ?\n\n", "id": 41, "link_path": "linear_algebra.html", "title": "linear_algebra", "title_path": "linear_algebra"}, {"contents": "Precision and Sensitivity\nSensitivity is the rate in which we find the positive (e.g. a disease). False positive is not cared about.\nPrecision is the rate in which we find the true positive.\nBeyes Classifier\nLearning:  Learning is done by computing $P(y|{ x})$, where $x$ is the data.\nClassifying: $P(x^*|y)$ where $x$ is the new data.\nHow these probability computations are done? By MLE. TO be specific,...\nFor an event\n$p(y=c)= \\frac{\\sum^M_{i=1} \\mathbb I [y^{(i)} = c ]  }{M}  \\quad c \\in \\{1,2\\}$\n\u5e73\u5747\u6709\u591a\u5c11\u4e2a\u6837\u672c\u843d\u5728\u7c7b\u522b c \u4e2d\u3002\nMaximal Likelihood\nFunctions are convex =\u003e derivative = 0 means global manimum\nTODO. proof of gaussian distribution\u0027s ML estimation.\nA1Q2  \u7528\u6765\u4f30\u8ba1\u7684\u662f\u4e09\u4e2aiid\u968f\u673a\u53d8\u91cf\u3002\u5b9e\u9645\u4e0a\u662f\u4e00\u4e2a\u968f\u673a\u53d8\u91cf\u3002\nRegression\nHow is noise defined -- when we have done the regression knowing the $w$, is noise known?\n\u566a\u97f3\u7684\u53c2\u6570\u662f\u4f9d\u8d56\u4e8e\u8bef\u5dee$r$ \u7684\u3002\n\u540e\u9a8c\u5206\u5e03\n\u53c2\u6570$\\theta$ \u7684\u540e\u9a8c\u5206\u5e03\u7684\u5bc6\u5ea6\u662f $P(\\theta |D)$\u3002 \u8fd9\u4e2a\u662f\u53c2\u6570\u7684\u5206\u5e03\n\n$$P(\\theta |D ) = \\frac{P(D \\mid \\theta) P(\\theta)}{P(D)}$$\n\n$P(D)$ \u7684\u5b9a\u4e49\u662f\u6837\u672c\u5bc6\u5ea6\u3002\u7c7b\u4f3c\u4e8e Class Notes \u4e2d\u7684\u201c\u5e73\u5747\u6709\u591a\u5c11\u4e2a\u6837\u672c\u843d\u5728\u7c7b\u522b c \u4e2d\u201d\u3002\n\u540e\u9a8c\u9884\u6d4b $P(x^\\star \\mid \\theta )$\n\u8fd9\u53ea\u662f\u7ed9\u5b9a\u53c2\u6570$\\theta$ \u7684$x$.  \uff08\u610f\u601d\u662f $P(X = x^\\star \\mid \\theta)$ , $X$ \u6709\u4e00\u4e2a\u53c2\u6570\u662f$\\theta$. \u7684\u5206\u5e03\uff09\n\u540e\u9a8c\u4f30\u8ba1: $$p(x^\\star | D) = \\int P(x^\\star \\mid \\theta)P(\\theta |D)d\\theta$$\n\nprior \u7684\u521d\u59cb\u53c2\u6570\u600e\u4e48\u9009\u90fd\u53ef\u4ee5\u5417\uff1f\n\nMAP \u548c\u540e\u9a8c\u5206\u5e03\u533a\u522b\n\u540e\u9a8c\u5206\u5e03\u662f\u4e00\u4e2a\u5206\u5e03\u3002MAP \u662f\u6c42\u51fa\u4e00\u4e2a\u53c2\u6570\u7684\u6570\u5b57\u3002\nExample:  \u53ef\u4ee5\u7b97\u8fd9\u4e2a $y$ \u7684\u540e\u9a8c\u5206\u5e03\n\nSVM\nWhy should we penalize the weight \uff1f\n# step size for the sliding window\nstep = 4\n\n# extract window patches with step size of 4\npatches = skimage.util.view_as_windows(testimg, (19,19), step=step)\npsize = patches.shape\n\n# collapse the first 2 dimensions\npatches2 = patches.reshape((psize[0]*psize[1], psize[2], psize[3]))\nprint(patches2.shape )\n\n# histogram equalize patches (improves contrast)\npatches3 = empty(patches2.shape)\nfor i in range(patches2.shape[0]):\n    patches3[i,:,:] = skimage.exposure.equalize_hist(patches2[i,:,:])\n\n# extract features\nnewXf = extract_features(patches3)\n\n\nview_as_windows extract  \u56fe\u50cf\uff0c\u901a\u8fc7\u6ed1\u52a8\u7a97\u53e3\u3002\u5927\u5c0f19$\\times$ 19\npateches.shape   \u300c\u539f\u672c\u300d\u7684\u5f62\u72b6\npatches.reshape \u91cd\u65b0\u5851\u5f62\u3002 \uff08\u5e94\u8be5\u662f\u81ea\u52a8\u5224\u65ad\u524d\u4e24\u4e2a\u600e\u4e48collapse\uff1f\uff09\n\u6bcf\u4e2a patches2[i,:,:] \u662f\u4e00\u4e2a\u5c0fpatch.\npatches2 \u7b2c\u4e00\u4e2a\u7ef4\u5ea6\u662f\u4ec0\u4e48\uff1a\u662f\u6240\u6709patch \u7684\u6570\u91cf\npatches \u524d\u4e24\u4e2a\u7ef4\u5ea6\u662f\u4ec0\u4e48\uff1fnum_y_win (y\u65b9\u5411\u7a97\u53e3\u6570\u91cf) \u548c num_x_win (x\u65b9\u5411\u7a97\u53e3\u6570\u91cf)\u3002\nnum_y_win  \u7a97\u53e3\u4e0a\u4e0b\u6ed1\u52a8\u4e00\u5171\u80fd\u4ea7\u751f\u591a\u5c11\u884c\u7a97\u53e3\nnum_x_win \u7a97\u53e3\u5de6\u53f3\u6ed1\u52a8\u4e00\u5171\u80fd\u4ea7\u751f\u591a\u5c11\u884c\u7a97\u53e3\n\u540e\u9a8c\u5206\u5e03\nMaximum a posterior\n\u5982\u679c\u5728$\\theta=t$ \u65f6\uff0c\u6570\u636e$D$ \u6709\u5206\u5e03$p(D|\\theta =t)$. \u5e76\u4e14\u6211\u4eec\u4e5f\u5047\u8bbe\u77e5\u9053$\\theta$ \u662f\u4ec0\u4e48\u5206\u5e03\u3002\u90a3\u4e48MAP \u5c31\u662f\u8ba1\u7b97\n$$\\arg \\max_\\theta p(\\theta = t|D=x) = \\arg \\max_\\theta \\frac{p(D=x \\mid \\theta =t)p(\\theta =t)}{\\displaystyle\\sum_s p(D=x|\\theta=s)}$$\n[\u4fee\u6539] \u5b9e\u9645\u4e0a \u5206\u6bcd\u548c$\\theta$ \u6ca1\u5173\u7cfb\uff0c\u6240\u4ee5\u53ea\u8981\u6700\u5927\u5316\u5206\u5b50\u5c31\u53ef\u4ee5\n\n$$\\arg \\max_\\theta p(\\theta = t|D=x) = \\arg \\max_\\theta p(D=x \\mid \\theta =t)p(\\theta =t)$$\n\nML\u662f\u53cd\u8fc7\u6765P \u4e2d \u7684 $\\theta$ \u548c$D$\nPosterior Estimation\n\u7528\u5168\u90e8\u540e\u9a8c\u5206\u5e03\u7684\u5168\u90e8\u6982\u7387\u4ea7\u751f\u7684\u7ed3\u679c\u52a0\u6743\u5e73\u5747\uff08\uff1f\uff09\nBernoulli Update\n\u4e00\u5f00\u59cb\u7684\u5148\u9a8c\u662f\u5173\u4e8e\u53c2\u6570$\\pi$ \u7684beta\u5206\u5e03\u3002\n\u7ed3\u679c\u662f\u4e00\u4e2a\u4f2f\u52aa\u5229\u5206\u5e03\u4e2d\u53c2\u6570 $\\pi$ \u7684\u5206\u5e03\u3002\nK-means\n$\\pi_k$ \u89c2\u5bdf\u5230\u7b2ck\u5806\u7684\u6982\u7387\u3002\u8fd9\u662f\u4e00\u4e2a\u9690\u53d8\u91cf $Z= k$  \u7684\u6982\u7387\u3002\n\u89c2\u5bdf\u5230\u5411\u91cf$x_i$ \u7684\u6761\u4ef6\u4e0b\uff0c\u5728\u7b2c$k$ \u5806\u7684\u6982\u7387\uff1a\n$$\\gamma_{ik} = P(Z= k\\mid x_i )$$\n\u56e0\u4e3a\u4e00\u4e2a\u7a7a\u95f4\u6240\u6709\u6837\u672c\u6982\u7387\u603b\u548c\u4e3a$1$, \u6240\u4ee5$$\\sum_k \\gamma_{ik} = 1. \\tag{1}$$\nK means - Soft Assignment\n$Z = k \\mid x_i$  \u4e0d\u662f\u4e00\u4e2a\u5e38\u6570(\u5373\uff0c\u4e0d\u5728\u4efb\u610f\u4e00\u70b9\u6982\u7387\u662f1)\u3002\n$Z \\sim N(\\mu_k^{(0)}, \\sigma_k^{(0)})$ \u65f6\nE-M step \u53ef\u4ee5\u66f4\u65b0$\\mu_k$ \u548c$\\sigma_k$.  \u5206\u522b\u6709\u4e00\u4e2a\u516c\u5f0f\u2026\u2026\nHard Assignment\n$\\gamma_{ik} \\in \\{0,\\ 1\\}$  \u3002\u66f4\u65b0\u540e\u7684\u4e2d\u5fc3\u662f\u4e00\u5806\u4e2d\u6240\u6709\u70b9\u7684\u5e73\u5747\n$$\\mu_{k}^{(1)}=\\frac{\\sum \\gamma_{ik} x_i}{\\sum_i\\gamma_{ik}} =\\frac{\\sum_{i\u5728\u7b2ck\u5806\u4e2d} x_i}{\\sum_{i \u5728\u7b2ck\u5806\u4e2d} 1}$$\nMLE \u548c MAP \u533a\u522b\n1. \u6781\u5927\u4f3c\u7136\u4f30\u8ba1\uff08MLE\uff09\n\n\u4e0d\u9700\u8981\u5148\u9a8c\uff08No Prior\uff09\u3002\n\u57fa\u672c\u903b\u8f91\uff1a\u53ea\u5173\u6ce8\u5f53\u524d\u89c2\u5bdf\u5230\u7684\u6570\u636e $x$\u3002\u5b83\u5047\u8bbe\u53c2\u6570 $\\theta$ \u662f\u4e00\u4e2a\u56fa\u5b9a\u4f46\u672a\u77e5\u7684\u771f\u5b9e\u5e38\u6570\uff0c\u5bfb\u627e\u80fd\u4f7f\u6570\u636e $x$ \u51fa\u73b0\u6982\u7387\uff08\u4f3c\u7136 $p(x \\mid \\theta)$\uff09\u6700\u5927\u7684\u90a3\u4e2a $\\theta$\u3002\n\u6570\u5b66\u8868\u793a\uff1a\n$$\\hat{\\theta}_{\\text{MLE}} = \\arg\\max_{\\theta} p(x \\mid \\theta)$$\n\n2. \u540e\u9a8c\u4f30\u8ba1\uff08\u4f8b\u5982 \u6700\u5927\u540e\u9a8c\u4f30\u8ba1 MAP\uff09\n\n\u5fc5\u987b\u9700\u8981\u5148\u9a8c\uff08Requires Prior\uff09\u3002\n\u57fa\u672c\u903b\u8f91\uff1a\u57fa\u4e8e\u8d1d\u53f6\u65af\u5b66\u6d3e\u7684\u89c2\u70b9\uff0c\u53c2\u6570 $\\theta$ \u672c\u8eab\u4e5f\u662f\u4e00\u4e2a\u968f\u673a\u53d8\u91cf\uff0c\u5728\u89c2\u5bdf\u5230\u6570\u636e\u4e4b\u524d\u6211\u4eec\u5c31\u5bf9\u5b83\u6709\u4e00\u5b9a\u7684\u8ba4\u77e5\u6216\u503e\u5411\uff08\u5148\u9a8c\u5206\u5e03 $p(\\theta)$\uff09\u3002\u540e\u9a8c\u4f30\u8ba1\u901a\u8fc7\u8d1d\u53f6\u65af\u516c\u5f0f\u5c06\u201c\u5148\u9a8c\u201d\u4e0e\u201c\u6570\u636e\u4f3c\u7136\u201d\u7ed3\u5408\uff0c\u5bfb\u627e\u4f7f\u540e\u9a8c\u6982\u7387 $p(\\theta \\mid x)$ \u6700\u5927\u7684 $\\theta$\u3002\n\u6570\u5b66\u8868\u793a\uff1a\n$$\\hat{\\theta}_{\\text{MAP}} = \\arg\\max_{\\theta} p(\\theta \\mid x) = \\arg\\max_{\\theta} \\left[ \\underbrace{p(x \\mid \\theta)}_{\\text{\u4f3c\u7136}} \\cdot \\underbrace{p(\\theta)}_{\\text{\u5148\u9a8c}} \\right]$$\n\n\u603b\u7ed3\u5bf9\u6bd4\n\nMLE = \u7eaf\u7cb9\u770b\u6570\u636e\uff08$\\text{\u6570\u636e\u4f3c\u7136}$\uff09\n\u540e\u9a8c\u4f30\u8ba1\uff08MAP\uff09 = \u6570\u636e + \u7ecf\u9a8c\uff08$\\text{\u6570\u636e\u4f3c\u7136} \\times \\text{\u5148\u9a8c\u6982\u7387}$\uff09\n\u5f53\u5148\u9a8c\u5206\u5e03 $p(\\theta)$ \u662f\u5747\u5300\u5206\u5e03\uff08\u5373\u5bf9\u6240\u6709\u53ef\u80fd\u7684 $\\theta$ \u4e0d\u504f\u4e0d\u501a\uff0c\u7b49\u6982\u7387\u770b\u5f85\uff09\u65f6\uff0cMAP \u7684\u8ba1\u7b97\u7ed3\u679c\u5c31\u4f1a\u9000\u5316\u4e3a\u4e0e MLE \u5b8c\u5168\u4e00\u81f4\u3002\n\nFull Posterior distribution vs. MAP\n\nclass 1 with probability $p$\nclass  2 with probability $1-p$\nThe ratio is $\\frac{p}{1 - p}$.\nif both in the form exp, then $\\log p/(1-p) = \\log (exp (\\cdot)) = \\cdot$\n\n\u4e0d\u592a\u660e\u767d\uff1a\u6c42\u51fa\u6765likelihood \uff0c\u4f46\u662f\u4e0d\u77e5\u9053\u53c2\u6570\u662f\u4ec0\u4e48\u3002\u7528MLE \u6765\u8ba1\u7b97\u5417\uff1f\n", "id": 42, "link_path": "Machine_Learning_5489/Class_Notes.html", "title": "Class Notes", "title_path": "Machine_Learning_5489/class notes"}, {"contents": "\n\n\n", "id": 43, "link_path": "pages/contents.html", "title": "contents", "title_path": "pages/contents"}, {"contents": "\u4e3a\u4ec0\u4e48w \u66f4\u65b0\u662f\u52a0\uff0c$\\theta$ \u66f4\u65b0\u662f\u51cf\n\u4ee5 ADALINE \u4e3a\u4f8b\uff0c$y= w^Tx -\\theta$\uff0c$E=\\tfrac12(z-y)^2$\uff0c$\\Delta=-\\eta\\,\\partial E/\\partial(\\cdot)$\uff1a\n$$\\frac{\\partial E}{\\partial w_i}=\\underbrace{\\frac{\\partial E}{\\partial y}}_{-(z-y)}\\cdot\\underbrace{\\frac{\\partial y}{\\partial u}}_{1}\\cdot\\underbrace{\\frac{\\partial u}{\\partial w_i}}_{x_i}=-(z-y)x_i\n\\quad\\Rightarrow\\quad\n\\Delta w_i=+\\eta(z-y)x_i$$\n$$\\frac{\\partial E}{\\partial \\theta}=\\underbrace{-(z-y)}_{\\partial E/\\partial y}\\cdot\\underbrace{(-1)}_{\\partial u/\\partial\\theta}=+(z-y)\n\\quad\\Rightarrow\\quad\n\\Delta\\theta=-\\eta(z-y)$$\n\n\u03b8 \u5c31\u662f\u4e00\u4e2a\"\u8f93\u5165\u6052\u4e3a \u22121 \u7684\u6743\u91cd\" delta = lr * (z-y) * input\n\nXOR \u4e0d\u80fd\u88ab\u5355\u5c42\u7f51\u7edc\u5212\u5206\n\u5728 $\\mathbb R^n$ \u91cc\u90fd\u6210\u7acb\uff1a\u8d85\u5e73\u9762 $H=\\{x: w^{\\mathsf T}x+\\theta=0\\}$\uff08\u8981\u6c42 $w\\neq0$\uff09\u628a\u7a7a\u95f4\u5206\u6210\u7684\u4e24\u4e2a\u95ed\u534a\u7a7a\u95f4\n$$H^{+}=\\{x: w^{\\mathsf T}x+\\theta\\ge 0\\},\\qquad H^{-}=\\{x: w^{\\mathsf T}x+\\theta\\le 0\\}$$\n\u90fd\u662f\u51f8\u96c6\u3002\uff08$\\mathbb R^2$ \u91cc\u8d85\u5e73\u9762\u662f\u76f4\u7ebf\uff0c$\\mathbb R^3$ \u91cc\u662f\u5e73\u9762\u3002\uff09\n\u6ce8\uff1a\u8fd9\u91cc\u6309\u4f60\u7684\u5199\u6cd5 $w^{\\mathsf T}x+\\theta=0$\uff1b\u672c\u8bfe\u7a0b slides \u7528 $u=\\sum w_ix_i-\\theta$\uff0c\u53ea\u662f \u03b8 \u7b26\u53f7\u76f8\u53cd\uff0c\u4e0d\u5f71\u54cd\u7ed3\u8bba\u3002\n\u8bc1\u660e\n\u51f8\u96c6\u5b9a\u4e49\uff1a$S$ \u51f8 $\\iff$ $\\forall x_1,x_2\\in S,\\ \\forall\\lambda\\in[0,1]$\uff0c\u90fd\u6709 $\\lambda x_1+(1-\\lambda)x_2\\in S$\u3002\n\u7b2c 1 \u6b65\uff1a\u4eff\u5c04\u51fd\u6570\u4fdd\u6301\u51f8\u7ec4\u5408\uff08\u5173\u952e\u5f15\u7406\uff09\n\u4ee4 $f(x)=w^{\\mathsf T}x+\\theta$\uff0c\u5219\u5bf9\u4efb\u610f $x_1,x_2$ \u548c $\\lambda\\in[0,1]$\uff1a\n$$f\\big(\\lambda x_1+(1-\\lambda)x_2\\big)\n= w^{\\mathsf T}\\big(\\lambda x_1+(1-\\lambda)x_2\\big)+\\theta$$\n$$= \\lambda w^{\\mathsf T}x_1+(1-\\lambda)w^{\\mathsf T}x_2+\\underbrace{\\lambda\\theta+(1-\\lambda)\\theta}_{=\\ \\theta\\ (\\text{\u56e0\u4e3a }\\lambda+(1-\\lambda)=1)}\n= \\lambda f(x_1)+(1-\\lambda)f(x_2)$$\n\uff08\u6ce8\u610f\u6700\u540e\u4e00\u6b65\u7528\u4e86 $\\lambda+(1-\\lambda)=1$\u2014\u2014\u8fd9\u6b63\u662f\"\u4eff\u5c04\"\uff08\u7ebf\u6027 + \u5e38\u6570\uff09\u800c\u975e\u7eaf\u7ebf\u6027\u7684\u5730\u65b9\u3002\uff09\n\u7b2c 2 \u6b65\uff1a\u534a\u7a7a\u95f4\u7684\u5b9a\u4e49\u7acb\u5373\u7ed9\u51fa\u51f8\u6027\n\u8bbe $x_1,x_2\\in H^{+}$\uff0c\u5373 $f(x_1)\\ge0,\\ f(x_2)\\ge0$\u3002\u56e0\u4e3a $\\lambda\\ge0$\u3001$(1-\\lambda)\\ge0$\uff1a\n$$f\\big(\\lambda x_1+(1-\\lambda)x_2\\big)=\\lambda f(x_1)+(1-\\lambda)f(x_2)\\ \\ge\\ \\lambda\\cdot 0+(1-\\lambda)\\cdot 0=0$$\n\u6240\u4ee5\u7ebf\u6bb5\u4e0a\u4efb\u4e00\u70b9\u4ecd\u5c5e\u4e8e $H^{+}$ \u27f9 $H^{+}$ \u51f8\u3002$H^{-}$ \u628a\u4e0d\u7b49\u53f7\u53cd\u5411\uff0c\u540c\u7406\u3002$\\blacksquare$\n\u4e09\u4e2a\u8865\u5145\n\n\u7b49\u4ef7\u8bc1\u6cd5\uff08\u66f4\"\u73b0\u4ee3\"\u7684\u5199\u6cd5\uff09\n$f$ \u662f\u4eff\u5c04\u51fd\u6570 \u27f9 \u65e2\u662f\u51f8\u51fd\u6570\u4e5f\u662f\u51f9\u51fd\u6570 \u27f9 $H^{+}=\\{f\\le -\\theta\u0027\\}$\u2026 \u5373 \u51f8\u51fd\u6570\u7684\u4e0b\u6c34\u5e73\u96c6\u5fc5\u4e3a\u51f8\u96c6\uff0c\u4e00\u884c\u8bc1\u5b8c\u3002\uff08\u534a\u7a7a\u95f4 = \u51f8\u51fd\u6570\u7684 sublevel set\u3002\uff09\n\u8fb9\u754c\u4e0e\u5212\u5206\u7684\u7ec6\u8282\n\u4e25\u683c\u534a\u7a7a\u95f4 $\\{f\u003e0\\}$\u3001$\\{f\u003c0\\}$ \u4e5f\u662f\u51f8\u7684\uff08\u5f00\u96c6\uff09\uff1b\n\u8fb9\u754c $\\{f=0\\}$ \u672c\u8eab\u662f\u4eff\u5c04\u5b50\u7a7a\u95f4\uff08\u7ef4\u5ea6 $n-1$\uff09\uff0c\u4e5f\u51f8\uff0c\u4f46\u5185\u90e8\u4e3a\u7a7a\uff1b\n\u771f\u6b63\u7684\"\u5212\u5206\"\u662f\u4e09\u5206\uff1a$\\{f\u003e0\\}\\ \\dot\\cup\\ \\{f=0\\}\\ \\dot\\cup\\ \\{f\u003c0\\}$\uff1b\u4e24\u4e2a\u95ed\u534a\u7a7a\u95f4\u5728\u8fb9\u754c\u4e0a\u91cd\u53e0\u3002\n\u9000\u5316\u60c5\u5f62\uff1a\u82e5 $w=0$\uff0c\u5219 $\\theta=0$ \u65f6 $H^+=H^-=\\mathbb R^n$\uff08\u6ca1\u5207\u5f00\uff09\uff0c$\\theta\\neq0$ \u65f6\u4e00\u534a\u4e3a\u7a7a\u2014\u2014\u6240\u4ee5\u5b9a\u7406\u8981\u6c42 $w\\neq0$\u3002\n\u4e3a\u4ec0\u4e48\u8fd9\u4e2a\u51f8\u6027\u5728\u8bfe\u7a0b\u91cc\u5f88\u91cd\u8981\nXOR \u7684\u672c\u8d28\uff1a\u5355\u4e2a\u8d85\u5e73\u9762\u53ea\u80fd\u5207\u51fa\u51f8\u7684\uff08\u534a\u7a7a\u95f4\u578b\uff09\u533a\u57df\uff0c\u800c XOR \u7684\u6bcf\u4e2a\u7c7b\u533a\u57df\u662f\u4e24\u4e2a\u4e0d\u8fde\u901a\u7684\u8c61\u9650\uff08\u975e\u51f8\uff09\u27f9 \u5fc5\u7136\u5207\u4e0d\u5f00\u3002\u8fd9\u4e5f\u662f Q1(b) \u90a3\u95ee\"\u7528\u51f8\u5305\u91cd\u53e0\u89e3\u91ca\"\u7684\u7406\u8bba\u6839\u636e\uff1a\u5b58\u5728\u5206\u9694\u8d85\u5e73\u9762 \u27fa \u4e24\u7c7b\u70b9\u96c6\u7684\u51f8\u5305\u4e0d\u76f8\u4ea4\uff08\u8d85\u5e73\u9762\u5206\u79bb\u5b9a\u7406\uff09\u3002\nSVM \u7684\u6839\u57fa\uff1a\u7ea6\u675f $y_i(w^{\\mathsf T}x_i+b)\\ge1$ \u662f\u4e00\u65cf\u534a\u7a7a\u95f4\uff0c\u534a\u7a7a\u95f4\u7684\u4ea4\u4ecd\u662f\u51f8\u96c6 \u27f9 SVM \u539f\u59cb\u95ee\u9898\u7684\u53ef\u884c\u57df\u662f\u51f8\u591a\u9762\u4f53\uff0c\u76ee\u6807 $\\tfrac12\\lVert w\\rVert^2$ \u662f\u51f8\u51fd\u6570 \u27f9 \u6574\u4e2a\u539f\u59cb\u95ee\u9898\u662f\u51f8\u4e8c\u6b21\u89c4\u5212\uff0c\u6709\u552f\u4e00\u5168\u5c40\u6700\u4f18\uff08KKT \u5373\u4e3a\u5145\u8981\u6761\u4ef6\uff09\u2014\u2014Q4(a)(b) \u5168\u90e8\u5efa\u7acb\u5728\u8fd9\u4e2a\u6027\u8d28\u4e0a\u3002\n\nQ1\uff08Midterm\uff0c\u5171 10 \u5206\uff09\n\u8bbe\u4e00\u7ef4\u6570\u636e $\\{x_1,\\dots,x_N\\}$ i.i.d. \u6765\u81ea\u9ad8\u65af\u5206\u5e03 $\\mathcal{N}(x\\mid \\mu,\\sigma^2)$\uff0c\u5176\u4e2d $\\sigma^2$ \u5df2\u77e5\u3002\n(a) \u6c42 $\\mu$ \u7684\u6700\u5927\u4f3c\u7136\u4f30\u8ba1 $\\hat{\\mu}_{ML}$\uff0c\u5199\u51fa\u5b8c\u6574\u63a8\u5bfc\u3002\uff083 \u5206\uff09\n(b) \u73b0\u5bf9 $\\mu$ \u65bd\u52a0\u9ad8\u65af\u5148\u9a8c $p(\\mu)=\\mathcal{N}(\\mu\\mid m,s^2)$\uff0c\u6c42 $\\mu$ \u7684 MAP \u4f30\u8ba1 $\\hat{\\mu}_{MAP}$\u3002\uff083 \u5206\uff09\n(c) \u4ee4 $s^2\\to 0$\uff08\u5148\u9a8c\u8d8a\u6765\u8d8a\u5c16\u9510\uff09\uff0c$\\hat{\\mu}_{MAP}$ \u8d8b\u5411\u4ec0\u4e48\uff1f\u8bf7\u7ed9\u51fa\u89e3\u91ca\uff0c\u5e76\u8bf4\u660e\u8fd9\u4f53\u73b0\u4e86\u8d1d\u53f6\u65af\u4f30\u8ba1\u4e0e MLE \u7684\u4ec0\u4e48\u5173\u7cfb\u3002\uff082 \u5206\uff09\n(d) \u82e5\u6539\u7528\u5168\u8d1d\u53f6\u65af\u65b9\u6cd5\u5bf9\u65b0\u6837\u672c $x_*$ \u505a\u9884\u6d4b\uff0c\u5199\u51fa predictive distribution $p(x_*\\mid \\mathcal{D})$ \u7684\u5f62\u5f0f\uff08\u7528\u5171\u8f6d\u6027\uff09\uff0c\u5e76\u8bf4\u660e\u5b83\u4e0e\u76f4\u63a5\u7528 $\\hat{\\mu}_{MAP}$ \u4ee3\u5165 $\\mathcal{N}(x_*\\mid\\mu,\\sigma^2)$ \u5f97\u5230\u7684\u5206\u5e03\u6709\u4f55\u533a\u522b\u3002\uff082 \u5206\uff09\n", "id": 44, "link_path": "Perceptron.html", "title": "Perceptron", "title_path": "perceptron"}, {"contents": "Conditional Probability of a Uniform distribution\nIn a finite probability space with uniform distribution, the probability of a set is just its size divided by the total set. This leads to the equation that $P(A|B)= \\frac{|A\\cap B|}{|B|}$. In addition, the fact that every singleton has equal probabilities results in that $P(x|B) = \\frac{1}{|B|}$ for all $x\\in B$.\nIn general, the conditional probability conditioned on the event $A$ is a \"subprobability\", that is defined on the subspace (of the event space $\\Sigma$)\n$$\\mathcal T = \\{ S \\in \\Sigma | S \\subset A\\}.$$\nIt suffices to define the probability conditioned on $A$ of each singleton in a finite probability space. The space $\\mathcal T$ has the probability measure $P_{\\mathcal T}(S)=\\frac{|S|}{|A|}$ which is equal to the conditional probability of $S$ conditioned on $A$. Note how the uniform probability measure is inherited to the subspace via defining the conditional probability as the \"sub-measure\".\nSimplify Events Using Conditions\n", "id": 45, "link_path": "Probability.html", "title": "Probability", "title_path": "probability"}, {"contents": "Theory\nA Quadratic form is a function $Q\\colon V \\to K$ such that\n\n$Q(ax) = a^2 Q(x)$\n$(x,y) \\mapsto Q(x)Q(y) -Q(x) - Q(y)$ is a bilinear form.\n\nWe deote by $(x,y)$ the bilinear form $\\frac{1}{2}(Q(x)Q(y) -Q(x) - Q(y))$.\nThe radical of a quadratic subspace $W$ is $W^\\perp =\\{ v \\in V | \\forall w\\in W\\,\\, (w,v) =0 \\}$.\nA space $V$ is non-degenerate if $V^\\perp = \\{0\\}$.\nExercises\n\nLet $V$ be a non-degenerate space. Then $V= \\text{dim} W^\\perp + \\text{dim} W$.\n\nSolution. Consider the natural map $f\\colon V\\to V^*$. Recall that $V \\cong V^*$, so they have the same\ndimension. So, $f$ is surjective if and only if $f$ is injective. Since $V$ is non-degenerate, $f$ is injective,\nwhence $f$ is surjective. Since the restriction of a linear functional $v* : V \\to V*$ to $W$ is a surjection\n$V*\\to W*$, composition of this restriction with $f$ gives a surjection $g\\colon V \\to W^*$. Hence\n$$\\text{dim} V = \\text{dim} \\ker g + \\text{dim} W^* = \\text{dim} W^{\\perp} + \\text{dim} W.$$ Q.E.D.\n", "id": 46, "link_path": "quadratic_space.html", "title": "quadratic_space", "title_path": "quadratic_space"}, {"contents": "\u7b97\u6cd5\u7684\u968f\u673a\u5206\u6790\n\u00b7\u590d\u4e60\u00b7 \u79bb\u6563\u5747\u5300\u5206\u5e03\n\u6bcf\u4e00\u4e2a\u5355\u4e2a\u5143\u7d20\u7684\u6982\u7387\u662f\n$$\\frac{1}{|S|}$$\n", "id": 47, "link_path": "rand_alg.html", "title": "rand_alg", "title_path": "rand_alg"}, {"contents": "Algebra\n\ngroup_theory\nlinear_algebra\n[[Dot Product And Cross Product]]\nfields\nGauss Integer\n\n\nTopology\n\n[[Algebraic Topology]]\nsurfaces\n\nAnalysis\n\nSymmetric Integrals\nAbel Partial Summation\nAnalysis\nLimit involving e\nCompactness and Uniform Continuity\nsums\nIntegrals involving Absolute Values\n\nNumber Theory\n\nquadratic_space\nDescend Argument\n\nGeometry\n\n[[What is Geometry]]\n\n\n", "id": 48, "link_path": "README.html", "title": "README", "title_path": "readme"}, {"contents": "Offline learning\n\n\nSCOPE-RL: A Python library for offline reinforcement learning, off-policy evaluation, and selection  :https://github.com/hakuhodo-technologies/scope-rl\n\nIt also contains a dataset.\n\n\n\nOpen Bandit Pipeline: https://github.com/st-tech/zr-obp\n\n\nREINFORCE\nREINFORCE Algorithm\nA Practical Guide to Implementing the REINFORCE Algorithm in Python\nOld papers\nASN\n", "id": 49, "link_path": "Reinforcement_Learning.html", "title": "Reinforcement Learning", "title_path": "reinforcement learning"}, {"contents": "Special Relativity\n", "id": 50, "link_path": "Relativity.html", "title": "Relativity", "title_path": "relativity"}, {"contents": "\u65cb\u8f6c\u548c\u53cd\u5c04\n\u53c9\u79ef\u7684\u6027\u8d28\n\n\n$x\\times y \\perp x$\n\n\n$x\\times y$ \u5782\u76f4\u4e8e $x$ \u548c $y$\n\n\n$y + x \\times y$ \u4e0e x \u5782\u76f4\uff0c\u4e0e y \u5728\u540c\u4e00\u4e2a\u5e73\u9762\u4e0a\u3002\n\n\n\u7ed5\u8f74\u65cb\u8f6c\u77e9\u9635\n\u8981\u65cb\u8f6c\u7684\u5411\u91cf\n\u5206\u89e3\u6210\u5728\u8f74\u4e0a\u548c\u4e0e\u8f74\u5782\u76f4\u7684\u5e73\u9762\u4e0a\u7684\u5206\u91cf\u3002\n", "id": 51, "link_path": "rotation_relection.html", "title": "rotation_relection", "title_path": "rotation_relection"}, {"contents": "\nIs $$\\frac{1}{1 + z^n}$$ convergent or divergent for complex number $z$?\n\nHints. Comparison test for positive series: Suppose $\\{a_n\\}$ and $\\{b_n\\}$ are positive series. If $\\lim_{n\\to \\infty} \\frac{a_n}{b_n} = A (\\neq 0)$, then $\\sum a_n$ and $\\sum b_n$ simutaneously convergent or divergent.\nTerm Test: If $\\sum a_n$ is convergent, then $\\lim_{n\\to \\infty}a_n =0$.\nSolution. If $|z|\\leq 1$, then $$\\left|\\frac{1}{1 + z^n}\\right| \\geq \\frac{1}{|1| + |z^n|} = \\frac{1}{1 + 1} = \\frac{1}{2}.$$ So $\\lim_{n\\to \\infty} \\frac{1}{1 + x^n}\\neq 0$. So this series diverges for $|z|=1$. If $|z| \u003e1$, then $\\lim_{n\\to \\infty} \\frac{1}{1 + \\frac{1}{z^n}} = 1$. Let $b_n = \\frac{1}{z^n}$. The series $\\sum \\frac{1}{1 + z^n}$ converges because $$\\lim \\bigg(\\frac{1}{1 + z^n}\\bigg) \\bigg/b_n = \\lim_{n\\to \\infty} \\frac{1}{1 + \\frac{1}{z^n}} = 1$$ from which the comparison test confirms the convergence. $\\square$\n", "id": 52, "link_path": "sequences_series.html", "title": "sequences_series", "title_path": "sequences_series"}, {"contents": "Estimation of Summations\n$\\frac{1}{n} \\sum^n_{k=1} n^{1/k}$\nBy plotting, you can find that the $\\frac{1}{n} \\sum^\\infty_{k=1} k^{1/k}$ finally goes to $1$, because $\\{k^{1/k}\\} \\to 1$, from which the average goes to $1$ by Cesaro-Stolz lemma.\nNow replacing this sum by $\\frac{1}{n} \\sum^\\infty_{k=1} n^{1/k}$, it helps to\nestimate the new summation by splitting the sum into two pieces.\nThe summation is\n\n$$n + n^{1/2} + n^{1/3} + \\ldots n^{1/n}.$$\n\nThe first $\\ln(n)$ terms can be estimated by summing $\\sqrt n$.\nWhy would the upper bound $n^{1/k} \\leq \\sqrt n$ for the first $\\ln(n)$ work?? The reason is that we know the sum\n$\\sum_{2 \\leq k \u003c \\ln n} n^{1/k} \\leq \\ln(n) \\sqrt n = o(n)$ as $n\\to\\infty$, and so this upper bound is sufficient.\nNow we estimate $\\sum_{\\ln n \\leq k \\leq n} n^{1/k}$.\nInequality\nThe first inequality to use is\n$$e^{\\ln n /k} \\leq 3\\frac{\\ln n}{k} + 1$$ for $k\\geq \\ln n$.  ($e^x \u003c 3 \\implies e^x \u003c 3x +1$ for $x\\in [0,1]$)\nAlso, for $k \\geq 2$,$$1/k = \\int^{k}_{k-1} \\frac{1}{k} dt \u003c\\int^{k}_{k-1} \\frac{1}{t} dt$$\nSo $$\\sum^n_{k=2} 1/k \u003c \\sum^n_{k=2} \\int^k_{k-1} \\frac{1}{t}dt = \\int^n_{1} \\frac{1}{t}dt =\\ln n \\tag{1}$$\nConcluding Estimate\n\n$$\\sum_{\\ln n \u003c k \\leq n} n^{1/k} = \\sum_{\\ln n \u003c k \\leq n} e^{\\ln n/k} \u003c 3 \\ln n \\left(\\sum^n_{k=2} \\frac{1}{k}\\right) + n\u003c 3\\ln n \\ln n + n = o(n) + n$$\n\nHere we used the fact that $\\ln^j(n) = o(n^k)$ for all positive $j,k$.\nComments\nA key step in the estimation above is $e^x \u003c 3x +1$ for $x\\in [0,1]$, which is actually a quite precise one.\nGenerally, if $f(x)$ is convex on $[a, \\infty)$, then $f(x)\u003c Kx + D$ for $x\\in (a,\\infty)$, where $K=\\frac{f(b)-f(a)}{b-a}$ and $D=f(a)-Ka$. As a result, $$\\sum_{a\\leq x \\leq n} f(x) = \\underbrace{K\\sum_{a\\leq x \\leq n} x}_{(1)} + \\underbrace{Dn}_{(2)}$$ Note that when $a\u003e1$, (1) is $O(n^2)$ while $(2)$ is $O(n)$. They are not able to become a constant by letting be divided by a power of $n$. However, when $x\\in (0,1)$ and $a\\leq 0$, we can possibly make (1) of the magnitude $o(n)$.\nRelated Questions\n\n\n\n$$\\lim_{n\\to \\infty} \\frac{1}{n}\\sum^n_{k=1} \\sin\\left(\\frac{n}{k}\\right)$$\n\n\n\nAlso think about this problem when the argument of $\\sin$ is $k/n$ instead of $n/k$.\nThis is a Riemann sum.\n\n\n\n\n$$\\lim_{n\\to \\infty} \\frac{1}{n}\\sum_{\\ln n \u003c k\\leq n} \\exp(n/k)$$\n\nThis is a Riemann sum.\n3. $$\\lim_{n\\to \\infty} \\frac{1}{n}\\sum^n_{k=1} \\exp\\bigg(\\frac{\\ln\\ln n}{k}\\bigg)$$\nSolution. $\\exp(\\frac{\\ln\\ln n}{k}) = (\\ln n)^{1/k}$. So $\\sum \\exp\\bigg(\\frac{\\ln\\ln n}{k}\\bigg) = \\sum (\\ln n)^{1/k}$\nThe first piece of sum is $\\sum_{1\\leq k \\leq \\ln \\ln n} (\\ln n)^{1/k} \\leq \\ln\\ln n (\\ln n) = o(n)$\nNote that for $x\\in(0,1)$, $1\\leq e^x \\leq 1+ 2x$.\nThe second piece of the sum is $$\\sum_{\\ln\\ln n \u003c k \\leq n} (\\ln n)^{1/k} \\approx\\sum_{\\ln\\ln n \u003c k \\leq n} \\left( 1 + \\ln\\ln n (\\frac{1}{k})\\right)\\leq n  + \\ln\\ln n\\bigg(\\sum^n_{k=1} \\frac{1}{k}\\bigg)= n + \\ln\\ln (n) (\\ln n)=n + o(n)$$  So the whole sum is $n+ o(n)$.   Q.E.D.\nComment This proof splits the sum when $x$ in $e^x$ is greater than 1 than when it is less than 1. So, the key there is still the inequality $1\\leq e^x \\leq 1 +2x$. It is evident that, to make this average approach $1$ when $n\\to \\infty$, the choice of function $f(x)$ in the expression $f(x))^{1/k}$ is unessential.\n\n\n\n$$\\sum^n_{k=1}\\frac{1}{k^2}$$\n\n\n\n", "id": 53, "link_path": "sums.html", "title": "sums", "title_path": "sums"}, {"contents": "\n8.1.1 Which alphabets are manifolds?\n\nAnswer\n\n\n\nalphabet\nis it a manifold\nExplanation\n\n\n\n\nA\nNo.\nIt has crosses.\n\n\nB\nNo.\nSame reason\n\n\nC\nYes\n\n\n\nD\nYes\n\n\n\nE\nNo.\nIt has crosses\n\n\nF\nNo.\nSame  reason\n\n\nG\nYes\n\n\n\nH\nNo.\n\n\n\nI\nNo.\n\n\n\nJ\nYes.\n\n\n\nK\nNo.\n\n\n\nL\nYes.\n\n\n\nM\nYes.\n\n\n\nN\nYes\n\n\n\nO\nYes\n\n\n\nP\nNo.\n\n\n\nQ\nNo.\n\n\n\nR\nNo.\n\n\n\nS\nYes.\n\n\n\nT\nNo.\n\n\n\nU\nYes.\n\n\n\nV\nYes.\n\n\n\nW\nYes.\n\n\n\nY\nNo.\n\n\n\nZ\nYes.\n\n\n\n\n\n8.1.2 Prove that the real projective space $P^n$ is a manifold by constructing, for any $0\\leq i\\leq n$, a homeomorphism between the subset $$U_i = \\{\\text{span}\\{(x_0,x_1, \\ldots, x_n )\\} \\colon x_i \\neq 0 \\} \\subset P^n$$ and $\\mathbb R^n$. Similarly, prove that the complex projective space is also a manifold.\n\nRelevant Definitions. We denote space spanned by the vector $(x_1,\\dots, x_n)$ with thenotation $[x_1: \\dots : x_n]$. This definition implies that $[\\lambda x_1 : \\dots : \\lambda x_n] = [x_1 : \\dots : x_n]$. The real linear projective space $P^n$ is the set of $1$-dimensional linear subspaces of $\\mathbb R^n$. Let $\\phi\\colon \\mathbb R^n \\to P^n$, $(x_1,\\ldots,x_n)\\mapsto [x_1:\\dots:x_n]$. A set $V \\in P^n$ is open if and only $\\phi^{-1}(V)$ is open, by the definition of the topology of $P^n$.\nAnswer.\nWe will use the universal properties of the subspace and quotient topology.\nIn this proof, there is not much geometries going on; instead everything is just\nthe application of the universal properties.\nLet $S=:\\mathbb R^n \\setminus \\{0\\} - \\{(v_1,\\ldots,v_n)\\in \\mathbb R^n | v_i = 0\\}$.\nWe endow $S$ with the subspace topology of $\\mathbb R^n$. Also, the quotient map restricted on $S$ has the image $U_i$. Hence $\\pi\\colon : S \\to U_i$ is well defined.\nSince $f\\colon S\\to \\mathbb R^n$, $(v_1, \\ldots, v_n) \\to (\\frac{v_1}{v_i}, \\ldots, \\frac{v_n}{v_i})$ is a map such that $f(x) = f(y) \\iff \\exists \\lambda \\in \\mathbb R \\,s.t. \\, x=\\lambda y \\iff \\pi(x)=\\pi(y)$, there exists a unique map $g\\colon U_i \\to \\mathbb R^{n-1}$ such that $f=g\\circ \\pi$. This map $f$ is given by $[v_1: \\dots : v_i : \\dots : v_n] \\mapsto (v_1, \\ldots , v_n)$.\nNow, $g$ is continuous if and only if $f$ is continuous. Is $f$ continuous? The inclusion\nmap $\\iota_S: S\\to \\mathbb R^n$ is certainly continuous. Also, the inclusion map $\\iota_{\\mathbb{R}^{n-1}} \\to \\mathbb R^n$ is continuous. Since $\\iota_S = \\iota_{\\mathbb R^{n-1}} \\circ f$, we know that $f$ is continuous, by the universal property of the subspace $\\mathbb R^{n-1} \\subset \\mathbb R^n$. So, it follows that $g$ is continuous.\nWe need to show that the reverse of $g$ is continuous as well. It decomposes to a composition of continuous maps:\n$$\\mathbb R^{n-1} \\quad \\overset{(v_1, \\ldots, v_n) \\mapsto (v_1, \\ldots, 1, \\ldots ,v_n)}{\\to} \\quad S \\overset{\\pi}{\\to} U_i$$.\n", "id": 54, "link_path": "surfaces.html", "title": "surfaces", "title_path": "surfaces"}, {"contents": "If you\n", "id": 55, "link_path": "Symmetric_Integrals.html", "title": "Symmetric Integrals", "title_path": "symmetric integrals"}, {"contents": "Find $D_n$ $$D_n = \\begin{vmatrix} 1+a_1 \u0026 1 \u0026 \\cdots \u0026 1 \\\\ 1 \u0026 1+a_2 \u0026 \\cdots \u0026 1 \\\\ \\vdots \u0026 \\vdots \u0026 \\ddots \u0026 \\vdots \\\\ 1 \u0026 1 \u0026 \\cdots \u0026 1+a_n \\end{vmatrix}$$ \u5176\u4e2d $a_1\u200ba_2\u200b\u22efa_n\u200b=0$\u3002\n\u65b9\u6cd5\u4e00\uff1a\u52a0\u8fb9\u6cd
