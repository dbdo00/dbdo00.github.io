<h1 data-number="300" id="德语">德语</h1>
<p>主要参考 <a
href="https://www.youtube.com/playlist?list=PL1pijTdUwLsdFDgHHxFiMbNPwae7YqFbH">德语语法10小时</a>。</p>
<p>这个课程是把动词在代词之后讲的。我第一次学是先动词，再代词，自身也觉得代词比动词更复杂一些。弱变化努力记了一下，所以感觉好一点。</p>
<h2 data-number="300.1" id="人称代词">人称代词</h2>
<p>德语比英语多了一个宾格的变化，就是宾格的人称关词也要变化。</p>
<p>人称冠词是修饰名词，所以选择人称后，还要根据名词来变化。</p>
<p>宾格大部分上是主格人称冠词 + e ，唯一的例外是 Euer -&gt; Eure ，
Euren</p>
